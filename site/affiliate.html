<script>

];

var T = {
ar: {
  title:'سجّل كسفير أسد الأوبشن', sub:'اربح 4$ عمولة ثابتة عن كل تجديد اشتراك فعلي عبر كودك',
  name:'الاسم المستعار (المعروف)', legalName:'الاسم الكامل حسب الهوية/جواز السفر', country:'الدولة', city:'المدينة', email:'البريد الإلكتروني', age:'العمر',
  phone:'رقم الجوال', tg:'حساب تيليجرام', code:'كود التسويق الخاص بك', codeHint:'اختر كوداً غير مستخدم من سفير آخر — سنتحقق تلقائياً.',
  bank:'رقم الحساب البنكي (IBAN أو رقم حساب)', bankHint:'IBAN معتمد في السعودية وأغلب الدول — إن لم يكن متوفراً لديك اكتب رقم حسابك البنكي العادي.',
  agreePrefix:'أقرّ بأنني اطّلعت على', agreeLink:'اتفاقية سفراء أسد الأوبشن', agreeSuffix:'وأوافق على جميع بنودها وتعهداتها.',
  sig:'التوقيع (ارسم بإصبعك أو الماوس)', clearSig:'مسح التوقيع', submit:'تسجيل كسفير',
  thanksTitle:'تم تسجيلك بنجاح', thanksBody:function(code){return 'كودك <b style="color:#D4AF37;">'+code+'</b> جاهز الآن — شاركه مع عملائك واحصل على 4$ عن كل اشتراك فعلي يتجدد عبره.';},
  agreementTitle:'اتفاقية وإقرار وتعهد سفراء أسد الأوبشن',
  agreementBody:'<p><b>تمهيد:</b> تحكم هذه الاتفاقية العلاقة التعاقدية بين إدارة "أسد الأوبشن" ("الشركة") والشخص المسجّل كسفير تسويق ("السفير")، وتمثل بالتوقيع عليها إلكترونياً عقداً ملزماً كامل الأثر القانوني بين الطرفين.</p>' +
    '<p>1. التعريفات: يُقصد بـ"كود السفير" الرمز الفريد المخصص للسفير لتتبع الإحالات، ويُقصد بـ"العميل المُحال" كل مستخدم أكمل اشتراكاً مدفوعاً فعلياً باستخدام هذا الكود.</p>' +
    '<p>2. طبيعة العلاقة: هذه الاتفاقية لا تُنشئ أي علاقة عمل أو وكالة أو شراكة أو توظيف بين الطرفين؛ السفير متعاقد مستقل بالكامل ولا يحق له التصرف باسم الشركة أو الالتزام نيابة عنها بأي شكل.</p>' +
    '<p>3. العمولة: يستحق السفير عمولة ثابتة قدرها 4$ (أربعة دولارات أمريكية) عن كل عملية تجديد اشتراك مدفوع فعلياً ومكتمل السداد عبر كوده، ولا تُحتسب أي عمولة عن فترات التجربة المجانية أو المدفوعات الملغاة أو المستردة.</p>' +
    '<p>4. آلية الصرف: تُصرف العمولات المستحقة دورياً وفق آلية التواصل والتحويل المتفقة بين الطرفين عبر تيليجرام أو الحساب البنكي المسجّل، وتتحمل الشركة تكاليف التحويل المباشرة فقط ما لم يُتفق على خلاف ذلك.</p>' +
    '<p>5. دقة البيانات: يقرّ السفير بأن جميع البيانات المُدخلة (الاسم، الجنسية، معلومات التواصل، الحساب البنكي) صحيحة ومحدّثة وقت التسجيل، ويتحمل وحده مسؤولية أي ضرر ناتج عن تقديم بيانات غير صحيحة أو مضللة.</p>' +
    '<p>6. الطابع الشخصي للحساب: حساب السفير وكوده الخاص شخصيان تماماً وغير قابلين للتحويل أو التنازل أو المشاركة مع أي طرف ثالث دون موافقة كتابية مسبقة من الشركة.</p>' +
    '<p>7. الحظر على أساليب الترويج المخالفة: يلتزم السفير بعدم استخدام أي أسلوب ترويج مضلل أو كاذب أو منتهك للأنظمة المحلية أو الدولية، ويشمل ذلك على سبيل المثال لا الحصر: الرسائل غير المرغوبة (Spam)، الادعاءات الكاذبة بضمان الربح، أو انتحال هوية الشركة.</p>' +
    '<p>8. حظر تضارب المصالح: لا يجوز للسفير التسجيل بأكثر من كود واحد باسمه، ولا استخدام كود مسوّق آخر للحصول على عمولة مزدوجة عن نفس العميل.</p>' +
    '<p>9. الملكية الفكرية: جميع العلامات التجارية والشعارات والأسماء والمحتوى الخاص بـ"أسد الأوبشن" مملوكة حصرياً للشركة، ولا يمنح توقيع هذه الاتفاقية السفير أي حق ملكية أو ترخيص دائم لاستخدامها خارج نطاق الترويج المصرّح به.</p>' +
    '<p>10. حدود الاستخدام المسموح للعلامة: يجوز للسفير استخدام اسم وشعار "أسد الأوبشن" فقط لغرض الترويج المباشر لكوده، ويُحظر تعديل الشعار أو استخدامه بطريقة توحي بشراكة رسمية غير قائمة.</p>' +
    '<p>11. السرية: يتعهد السفير بالحفاظ على سرية أي معلومات غير علنية يطّلع عليها بحكم عمله كسفير (بيانات العملاء، آليات التسعير الداخلية، إحصائيات الأداء) وعدم إفشائها لأي طرف ثالث.</p>' +
    '<p>12. حماية بيانات العملاء: يُحظر على السفير جمع أو تخزين أو استخدام أي بيانات شخصية لعملاء مُحالين خارج ما توفره لوحة التحكم الرسمية، والالتزام بالأنظمة المعمول بها لحماية البيانات الشخصية.</p>' +
    '<p>13. حق التعليق والإلغاء: تحتفظ الشركة بحقها المطلق في تعليق أو إلغاء أي كود سفير فوراً ودون إشعار مسبق في حال ثبوت مخالفة أي بند من بنود هذه الاتفاقية.</p>' +
    '<p>14. أثر الإلغاء على العمولات: عند إلغاء الحساب لمخالفة جوهرية (كالاحتيال أو انتحال الهوية)، تسقط أي عمولات مستحقة لم تُصرف بعد، أما الإلغاء لأسباب غير جوهرية فلا يُسقط العمولات المكتسبة فعلياً حتى تاريخ الإلغاء.</p>' +
    '<p>15. عدم ضمان حد أدنى للدخل: لا تضمن الشركة أي حد أدنى من عدد الإحالات أو مقدار العمولة، والعائد يعتمد كلياً على جهد السفير الشخصي في التسويق.</p>' +
    '<p>16. المسؤولية الضريبية: يتحمل السفير وحده كامل المسؤولية عن الإقرار بأي دخل يحصل عليه من هذه الاتفاقية لدى الجهات الضريبية المختصة في بلده، ولا تتحمل الشركة أي التزام ضريبي نيابة عنه.</p>' +
    '<p>17. إخلاء المسؤولية عن قرارات التداول: السفير غير مخوّل بتقديم أي نصيحة أو توصية استثمارية باسم الشركة، وأي محتوى يقدّمه بصفته الشخصية لا يُعد صادراً عن الشركة ولا تتحمل الشركة أي مسؤولية عنه.</p>' +
    '<p>18. التعويض: يتعهد السفير بتعويض الشركة عن أي ضرر أو خسارة أو مطالبة قانونية تنشأ عن مخالفته لبنود هذه الاتفاقية أو عن تصرفاته أثناء ترويجه للخدمة.</p>' +
    '<p>19. تحديد المسؤولية: أقصى مسؤولية تتحملها الشركة تجاه السفير بموجب هذه الاتفاقية لا تتجاوز إجمالي العمولات المستحقة وغير المصروفة له وقت أي نزاع.</p>' +
    '<p>20. القوة القاهرة: لا تتحمل الشركة مسؤولية أي تأخير أو إخفاق في الوفاء بالتزاماتها ناتج عن ظروف خارجة عن إرادتها (كأعطال تقنية جسيمة، كوارث طبيعية، أو تغييرات تنظيمية مفاجئة).</p>' +
    '<p>21. مدة الاتفاقية: تسري هذه الاتفاقية من تاريخ الموافقة الإلكترونية عليها ولمدة غير محددة، ويحق لأي من الطرفين إنهاؤها في أي وقت بإشعار كتابي عبر تيليجرام.</p>' +
    '<p>22. حق التعديل: تحتفظ الشركة بحق تعديل شروط العمولة أو بنود هذه الاتفاقية في أي وقت، على أن يُخطر السفير بالتعديلات الجوهرية، ويُعد استمراره بالعمل كسفير بعد الإخطار موافقة ضمنية على التعديل.</p>' +
    '<p>23. عدم جواز التنازل: لا يجوز للسفير التنازل عن حقوقه أو التزاماته بموجب هذه الاتفاقية لأي طرف ثالث دون موافقة كتابية من الشركة.</p>' +
    '<p>24. استقلالية البنود: في حال بطلان أي بند من بنود هذه الاتفاقية أو عدم قابليته للتنفيذ، يبقى سائر البنود نافذاً وساري المفعول بالكامل.</p>' +
    '<p>25. الاتفاق الكامل: تمثل هذه الوثيقة الاتفاق الكامل بين الطرفين فيما يخص برنامج السفراء، وتحل محل أي تفاهمات أو وعود شفهية سابقة.</p>' +
    '<p>26. صحة التوقيع الإلكتروني: يقرّ السفير بأن توقيعه الإلكتروني (المرسوم رقمياً) في هذا النموذج له ذات القوة والأثر القانوني للتوقيع الخطي اليدوي، ولا يجوز له إنكاره لاحقاً.</p>' +
    '<p>27. سجل الموافقة: تحتفظ الشركة بسجل إلكتروني يوثّق تاريخ ووقت موافقة السفير وبياناته المُدخلة كدليل إثبات قابل للاستخدام عند أي نزاع.</p>' +
    '<p>28. التواصل الرسمي: يُعد التواصل عبر حساب تيليجرام المسجّل هو القناة الرسمية المعتمدة بين الطرفين لأي إشعار أو مطالبة تتعلق بهذه الاتفاقية.</p>' +
    '<p>29. عدم الحصرية: هذه الاتفاقية غير حصرية، ويجوز للشركة التعاقد مع عدد غير محدود من السفراء دون أي التزام بمنح أي سفير أفضلية أو حصرية جغرافية.</p>' +
    '<p>30. حظر الإحالة الذاتية: لا يجوز للسفير استخدام كوده الخاص للاشتراك بنفسه أو لحساب مملوك له للحصول على عمولة عن اشتراكه الشخصي.</p>' +
    '<p>31. حق التدقيق: يحق للشركة مراجعة وتدقيق أي نشاط ترويجي أو إحالات مرتبطة بكود السفير للتحقق من الامتثال لبنود هذه الاتفاقية.</p>' +
    '<p>32. الاحتيال والإحالات الوهمية: أي محاولة لتوليد إحالات وهمية أو استخدام حسابات مزيفة أو أي وسيلة احتيالية أخرى تُسقط فوراً حق السفير في أي عمولة وتؤدي لإلغاء حسابه نهائياً.</p>' +
    '<p>33. القانون الحاكم: تخضع هذه الاتفاقية وتُفسَّر وفقاً لأنظمة المملكة العربية السعودية، دون إخلال بأي أحكام قانونية إلزامية أخرى قد تنطبق في بلد إقامة السفير.</p>' +
    '<p>34. تسوية النزاعات: يسعى الطرفان أولاً لتسوية أي خلاف ودياً عبر التواصل المباشر؛ وفي حال تعذر ذلك، يُحال النزاع للجهة القضائية أو التحكيمية المختصة وفق الأنظمة السارية.</p>' +
    '<p>35. اللغة المعتمدة: في حال وجود تعارض بين النسخة العربية من هذه الاتفاقية وأي نسخة مترجمة، تكون النسخة العربية هي المرجع القانوني المعتمد.</p>' +
    '<p>36. الإشعارات: تُرسل أي إشعارات رسمية بموجب هذه الاتفاقية إلى وسائل التواصل التي قدّمها السفير عند التسجيل، ويتحمل السفير مسؤولية تحديثها عند تغييرها.</p>' +
    '<p>37. عدم التنازل الضمني عن الحقوق: عدم ممارسة الشركة لأي حق مقرر لها بموجب هذه الاتفاقية في مناسبة معينة لا يُعد تنازلاً عن هذا الحق في المستقبل.</p>' +
    '<p>38. الأهلية القانونية: يقرّ السفير ببلوغه السن القانونية لإبرام العقود في بلد إقامته وبأن لا قيود قانونية تمنعه من إبرام هذه الاتفاقية.</p>' +
    '<p>39. استقلال برنامج السفراء عن أي توصية استثمارية: التسجيل كسفير أو الحصول على عمولات لا يرتبط بأي شكل بجودة أو دقة الإشارات أو الأدوات التي تقدمها الشركة، وهما نظامان مستقلان تماماً.</p>' +
    '<p>40. تجميد الحساب لعدم النشاط: إذا لم يُحقق السفير أي عميل مُحال فعلي خلال 14 يوماً من تاريخ تسجيله، أو إذا انتهت جميع اشتراكات عملائه المُحالين سابقاً دون أي عميل نشط حالياً، يحق للشركة تجميد حساب السفير تلقائياً حتى إشعار آخر، دون أن يؤثر ذلك على أي عمولات مكتسبة فعلياً قبل التجميد.</p><p>41. الإقرار النهائي: بالضغط على "تسجيل كسفير" والتوقيع أعلاه، يقرّ السفير بأنه قرأ جميع البنود أعلاه (من 1 إلى 41) وفهمها بالكامل، ويوافق عليها طواعية دون إكراه، ويتعهد بالالتزام الكامل بها.</p>',

  phone:'Phone Number', tg:'Telegram Account', code:'Your Referral Code', codeHint:'Choose a code not used by another ambassador — we\'ll check automatically.',

  thanksTitle:'Registered Successfully', thanksBody:function(code){return 'Your code <b style="color:#D4AF37;">'+code+'</b> is ready — share it and earn $4 for every real renewal.';},
  agreementTitle:'Option Lion Ambassador Agreement',
  agreementBody:'<p>Preamble: This Agreement governs the contractual relationship between Option Lion management ("the Company") and the person registered as a marketing ambassador ("the Ambassador"). Electronic acceptance constitutes a fully binding legal contract between both parties.</p><p>1. Definitions: "Ambassador Code" means the unique code assigned to the Ambassador to track referrals; "Referred Customer" means any user who completes an actual paid subscription using that code.</p><p>2. Nature of Relationship: This Agreement does not create any employment, agency, or partnership relationship between the parties; the Ambassador is a fully independent contractor with no authority to act or bind the Company in any way.</p><p>3. Commission: The Ambassador earns a fixed commission of $4 (four US dollars) per actual, fully paid subscription renewal made through their code. No commission accrues on free trial periods or on canceled or refunded payments.</p><p>4. Payment Mechanism: Due commissions are paid periodically via the agreed communication and transfer method (Telegram or registered bank account). The Company bears direct transfer costs only unless otherwise agreed.</p><p>5. Data Accuracy: The Ambassador confirms that all submitted data (name, nationality, contact details, bank account) is accurate and current at registration, and bears sole responsibility for any harm resulting from inaccurate or misleading data.</p><p>6. Personal Nature of Account: The Ambassador\'s account and code are strictly personal and may not be transferred, assigned, or shared with any third party without prior written consent from the Company.</p><p>7. Prohibited Promotion Methods: The Ambassador shall not use any misleading, false, or unlawful promotional method, including but not limited to spam messaging, false profit guarantees, or impersonating the Company.</p><p>8. Prohibition on Conflict of Interest: The Ambassador may not register more than one code under their name, nor use another ambassador\'s code to obtain double commission on the same customer.</p><p>9. Intellectual Property: All trademarks, logos, names, and content belonging to Option Lion are exclusively owned by the Company. Signing this Agreement grants the Ambassador no ownership right or permanent license to use them beyond authorized promotion.</p><p>10. Permitted Brand Use: The Ambassador may use the Option Lion name and logo solely to directly promote their code; modifying the logo or using it in a way implying an official partnership that does not exist is prohibited.</p><p>11. Confidentiality: The Ambassador undertakes to keep confidential any non-public information obtained through their role (customer data, internal pricing mechanisms, performance statistics) and not disclose it to any third party.</p><p>12. Customer Data Protection: The Ambassador is prohibited from collecting, storing, or using any personal data of referred customers beyond what the official dashboard provides, and must comply with applicable personal data protection regulations.</p><p>13. Right to Suspend and Terminate: The Company reserves the absolute right to immediately suspend or terminate any ambassador code without prior notice upon proof of breach of any term of this Agreement.</p><p>14. Effect of Termination on Commissions: Upon termination for material breach (fraud, impersonation), any unpaid due commissions are forfeited. Termination for non-material reasons does not forfeit commissions actually earned up to the termination date.</p><p>15. No Guaranteed Minimum Income: The Company does not guarantee any minimum number of referrals or commission amount; earnings depend entirely on the Ambassador\'s own marketing effort.</p><p>16. Tax Responsibility: The Ambassador bears sole responsibility for declaring any income earned under this Agreement to the relevant tax authorities in their country. The Company assumes no tax obligation on their behalf.</p><p>17. Disclaimer on Trading Decisions: The Ambassador is not authorized to give any investment advice or recommendation on the Company\'s behalf; any personal content they provide is not deemed issued by the Company, which bears no liability for it.</p><p>18. Indemnification: The Ambassador agrees to indemnify the Company against any damage, loss, or legal claim arising from their breach of this Agreement or their conduct while promoting the service.</p><p>19. Limitation of Liability: The Company\'s maximum liability to the Ambassador under this Agreement shall not exceed the total due, unpaid commissions at the time of any dispute.</p><p>20. Force Majeure: The Company bears no liability for any delay or failure to perform its obligations resulting from circumstances beyond its control (major technical failures, natural disasters, or sudden regulatory changes).</p><p>21. Term: This Agreement is effective from the date of electronic acceptance for an indefinite period; either party may terminate it at any time by written notice via Telegram.</p><p>22. Right to Amend: The Company reserves the right to amend the commission terms or provisions of this Agreement at any time; the Ambassador will be notified of material changes, and continuing to act as an ambassador after notice constitutes implied acceptance.</p><p>23. No Assignment: The Ambassador may not assign their rights or obligations under this Agreement to any third party without the Company\'s written consent.</p><p>24. Severability: Should any provision of this Agreement be held invalid or unenforceable, the remaining provisions remain in full force and effect.</p><p>25. Entire Agreement: This document constitutes the entire agreement between the parties regarding the ambassador program and supersedes any prior oral understandings or promises.</p><p>26. Validity of Electronic Signature: The Ambassador acknowledges that their electronic (digitally drawn) signature on this form carries the same legal force and effect as a handwritten signature and may not later be repudiated.</p><p>27. Consent Record: The Company keeps an electronic record documenting the date, time, and submitted data of the Ambassador\'s consent as usable evidence in any dispute.</p><p>28. Official Communication: Communication via the registered Telegram account is the officially recognized channel between the parties for any notice or claim related to this Agreement.</p><p>29. Non-Exclusivity: This Agreement is non-exclusive; the Company may contract with an unlimited number of ambassadors without any obligation to grant any ambassador preference or geographic exclusivity.</p><p>30. Prohibition on Self-Referral: The Ambassador may not use their own code to subscribe themselves or an account they own to earn a commission on their own subscription.</p><p>31. Right of Audit: The Company may review and audit any promotional activity or referrals linked to the Ambassador\'s code to verify compliance with this Agreement.</p><p>32. Fraud and Fake Referrals: Any attempt to generate fake referrals, use fake accounts, or any other fraudulent means immediately forfeits the Ambassador\'s right to any commission and results in permanent account termination.</p><p>33. Governing Law: This Agreement is governed by and construed in accordance with the laws of the Kingdom of Saudi Arabia, without prejudice to any other mandatory legal provisions that may apply in the Ambassador\'s country of residence.</p><p>34. Dispute Resolution: The parties shall first seek to resolve any dispute amicably through direct communication; failing that, the dispute shall be referred to the competent judicial or arbitral authority under applicable regulations.</p><p>35. Governing Language: In case of conflict between the Arabic version of this Agreement and any translated version, the Arabic version shall be the authoritative legal reference.</p><p>36. Notices: Any official notices under this Agreement shall be sent to the contact details provided by the Ambassador at registration; the Ambassador is responsible for keeping them updated.</p><p>37. No Implied Waiver: The Company\'s failure to exercise any right under this Agreement on any occasion does not constitute a waiver of that right in the future.</p><p>38. Legal Capacity: The Ambassador confirms they have reached the legal age to enter into contracts in their country of residence and that no legal restriction prevents them from entering into this Agreement.</p><p>39. Independence from Investment Advice: Registration as an ambassador or earning commissions is in no way linked to the quality or accuracy of the signals or tools provided by the Company; these are two entirely independent systems.</p><p>40. Account Freeze for Inactivity: If the Ambassador fails to bring in any actual referred customer within 14 days of registration, or if all previously referred customers' subscriptions have ended with no currently active customer, the Company may automatically freeze the Ambassador's account until further notice, without affecting any commissions actually earned prior to the freeze.</p><p>41. Final Acknowledgment: By clicking "Register as Ambassador" and signing above, the Ambassador acknowledges having read and fully understood all clauses above (1 through 41), voluntarily agrees to them without coercion, and undertakes full compliance.</p>',

  thanksTitle:'Erfolgreich registriert', thanksBody:function(code){return 'Ihr Code <b style="color:#D4AF37;">'+code+'</b> ist bereit — teilen Sie ihn und verdienen Sie 4$ pro echter Verlängerung.';},
  agreementTitle:'Option Lion Botschaftervereinbarung',
  agreementBody:'<p>Präambel: Diese Vereinbarung regelt das Vertragsverhältnis zwischen der Leitung von Option Lion ("das Unternehmen") und der als Marketing-Botschafter registrierten Person ("der Botschafter"). Die elektronische Zustimmung stellt einen vollständig rechtsverbindlichen Vertrag zwischen beiden Parteien dar.</p><p>1. Definitionen: "Botschaftercode" bezeichnet den dem Botschafter zugewiesenen eindeutigen Code zur Nachverfolgung von Empfehlungen; "empfohlener Kunde" bezeichnet jeden Nutzer, der über diesen Code ein tatsächlich bezahltes Abonnement abschließt.</p><p>2. Art der Beziehung: Diese Vereinbarung begründet kein Arbeits-, Vertretungs- oder Partnerschaftsverhältnis zwischen den Parteien; der Botschafter ist vollständig unabhängiger Vertragspartner ohne Befugnis, im Namen des Unternehmens zu handeln oder es zu binden.</p><p>3. Provision: Der Botschafter erhält eine feste Provision von 4$ (vier US-Dollar) pro tatsächlicher, vollständig bezahlter Abonnementverlängerung über seinen Code. Für kostenlose Testphasen sowie stornierte oder erstattete Zahlungen entsteht keine Provision.</p><p>4. Auszahlungsmechanismus: Fällige Provisionen werden regelmäßig über den vereinbarten Kommunikations- und Überweisungsweg (Telegram oder registriertes Bankkonto) ausgezahlt. Das Unternehmen trägt nur die direkten Überweisungskosten, sofern nichts anderes vereinbart wurde.</p><p>5. Datenrichtigkeit: Der Botschafter bestätigt, dass alle übermittelten Daten (Name, Nationalität, Kontaktdaten, Bankkonto) bei der Registrierung korrekt und aktuell sind, und trägt die alleinige Verantwortung für jeden Schaden aus unrichtigen oder irreführenden Angaben.</p><p>6. Persönlicher Charakter des Kontos: Konto und Code des Botschafters sind streng persönlich und dürfen ohne vorherige schriftliche Zustimmung des Unternehmens nicht übertragen, abgetreten oder mit Dritten geteilt werden.</p><p>7. Verbot unzulässiger Werbemethoden: Der Botschafter darf keine irreführenden, falschen oder rechtswidrigen Werbemethoden verwenden, einschließlich, aber nicht beschränkt auf Spam-Nachrichten, falsche Gewinnversprechen oder die Vortäuschung, für das Unternehmen zu handeln.</p><p>8. Verbot von Interessenkonflikten: Der Botschafter darf nicht mehr als einen Code auf seinen Namen registrieren und keinen fremden Code verwenden, um eine doppelte Provision für denselben Kunden zu erhalten.</p><p>9. Geistiges Eigentum: Alle Marken, Logos, Namen und Inhalte von Option Lion sind ausschließliches Eigentum des Unternehmens. Die Unterzeichnung dieser Vereinbarung gewährt dem Botschafter kein Eigentumsrecht oder dauerhaftes Nutzungsrecht über die genehmigte Werbung hinaus.</p><p>10. Zulässige Markennutzung: Der Botschafter darf Namen und Logo von Option Lion ausschließlich zur direkten Bewerbung seines Codes verwenden; eine Änderung des Logos oder eine Nutzung, die eine nicht bestehende offizielle Partnerschaft suggeriert, ist untersagt.</p><p>11. Vertraulichkeit: Der Botschafter verpflichtet sich, alle nicht öffentlichen Informationen, die er im Rahmen seiner Tätigkeit erhält (Kundendaten, interne Preismechanismen, Leistungsstatistiken), vertraulich zu behandeln und nicht an Dritte weiterzugeben.</p><p>12. Schutz der Kundendaten: Es ist dem Botschafter untersagt, personenbezogene Daten empfohlener Kunden über das offizielle Dashboard hinaus zu sammeln, zu speichern oder zu nutzen; er hat die geltenden Datenschutzvorschriften einzuhalten.</p><p>13. Aussetzungs- und Kündigungsrecht: Das Unternehmen behält sich das uneingeschränkte Recht vor, jeden Botschaftercode bei nachgewiesenem Verstoß gegen eine Bestimmung dieser Vereinbarung sofort und ohne vorherige Ankündigung auszusetzen oder zu kündigen.</p><p>14. Auswirkung der Kündigung auf Provisionen: Bei Kündigung wegen wesentlicher Pflichtverletzung (Betrug, Identitätsvortäuschung) verfallen alle noch nicht ausgezahlten fälligen Provisionen. Eine Kündigung aus anderen Gründen lässt bereits verdiente Provisionen bis zum Kündigungsdatum unberührt.</p><p>15. Kein garantiertes Mindesteinkommen: Das Unternehmen garantiert keine Mindestanzahl an Empfehlungen oder Provisionshöhe; der Ertrag hängt ausschließlich vom eigenen Marketingaufwand des Botschafters ab.</p><p>16. Steuerliche Verantwortung: Der Botschafter trägt die alleinige Verantwortung für die Angabe jeglicher aus dieser Vereinbarung erzielter Einkünfte gegenüber den zuständigen Steuerbehörden seines Landes. Das Unternehmen übernimmt keine steuerliche Verpflichtung in seinem Namen.</p><p>17. Haftungsausschluss für Handelsentscheidungen: Der Botschafter ist nicht befugt, im Namen des Unternehmens Anlageberatung oder -empfehlungen abzugeben; von ihm persönlich bereitgestellte Inhalte gelten nicht als vom Unternehmen stammend, das hierfür keine Haftung übernimmt.</p><p>18. Freistellung: Der Botschafter verpflichtet sich, das Unternehmen von jeglichem Schaden, Verlust oder Rechtsanspruch freizustellen, der aus einem Verstoß gegen diese Vereinbarung oder seinem Verhalten bei der Bewerbung des Dienstes entsteht.</p><p>19. Haftungsbeschränkung: Die maximale Haftung des Unternehmens gegenüber dem Botschafter aus dieser Vereinbarung übersteigt nicht die Summe der zum Zeitpunkt eines Streits fälligen, noch nicht ausgezahlten Provisionen.</p><p>20. Höhere Gewalt: Das Unternehmen haftet nicht für Verzögerungen oder Nichterfüllung seiner Pflichten aufgrund von Umständen außerhalb seiner Kontrolle (schwerwiegende technische Ausfälle, Naturkatastrophen oder plötzliche regulatorische Änderungen).</p><p>21. Laufzeit: Diese Vereinbarung gilt ab dem Datum der elektronischen Zustimmung auf unbestimmte Zeit; jede Partei kann sie jederzeit durch schriftliche Mitteilung über Telegram kündigen.</p><p>22. Änderungsrecht: Das Unternehmen behält sich das Recht vor, die Provisionsbedingungen oder Bestimmungen dieser Vereinbarung jederzeit zu ändern; der Botschafter wird über wesentliche Änderungen informiert, und die Fortsetzung seiner Tätigkeit nach der Mitteilung gilt als stillschweigende Zustimmung.</p><p>23. Keine Abtretung: Der Botschafter darf seine Rechte oder Pflichten aus dieser Vereinbarung nicht ohne schriftliche Zustimmung des Unternehmens an Dritte abtreten.</p><p>24. Salvatorische Klausel: Sollte eine Bestimmung dieser Vereinbarung unwirksam oder nicht durchsetzbar sein, bleiben die übrigen Bestimmungen in vollem Umfang wirksam.</p><p>25. Vollständige Vereinbarung: Dieses Dokument stellt die vollständige Vereinbarung zwischen den Parteien bezüglich des Botschafterprogramms dar und ersetzt alle vorherigen mündlichen Absprachen oder Zusagen.</p><p>26. Gültigkeit der elektronischen Signatur: Der Botschafter erkennt an, dass seine elektronische (digital gezeichnete) Unterschrift auf diesem Formular dieselbe Rechtskraft wie eine handschriftliche Unterschrift hat und später nicht bestritten werden kann.</p><p>27. Zustimmungsprotokoll: Das Unternehmen führt ein elektronisches Protokoll mit Datum, Uhrzeit und übermittelten Daten der Zustimmung des Botschafters als verwendbaren Beweis bei etwaigen Streitigkeiten.</p><p>28. Offizielle Kommunikation: Die Kommunikation über das registrierte Telegram-Konto ist der offiziell anerkannte Kanal zwischen den Parteien für jede Mitteilung oder Forderung im Zusammenhang mit dieser Vereinbarung.</p><p>29. Keine Exklusivität: Diese Vereinbarung ist nicht exklusiv; das Unternehmen kann mit einer unbegrenzten Anzahl von Botschaftern Verträge schließen, ohne verpflichtet zu sein, einem Botschafter Vorzug oder geografische Exklusivität zu gewähren.</p><p>30. Verbot der Selbstempfehlung: Der Botschafter darf seinen eigenen Code nicht verwenden, um sich selbst oder ein ihm gehörendes Konto anzumelden, um eine Provision für sein eigenes Abonnement zu erhalten.</p><p>31. Prüfungsrecht: Das Unternehmen kann jede mit dem Code des Botschafters verbundene Werbeaktivität oder Empfehlung überprüfen und prüfen, um die Einhaltung dieser Vereinbarung zu bestätigen.</p><p>32. Betrug und gefälschte Empfehlungen: Jeder Versuch, gefälschte Empfehlungen zu erzeugen, gefälschte Konten zu verwenden oder andere betrügerische Mittel einzusetzen, führt zum sofortigen Verlust jeglichen Provisionsanspruchs und zur endgültigen Kontokündigung.</p><p>33. Anwendbares Recht: Diese Vereinbarung unterliegt dem Recht des Königreichs Saudi-Arabien und ist danach auszulegen, unbeschadet zwingender Rechtsvorschriften, die im Wohnsitzland des Botschafters gelten können.</p><p>34. Streitbeilegung: Die Parteien bemühen sich zunächst, jede Streitigkeit einvernehmlich durch direkte Kommunikation beizulegen; gelingt dies nicht, wird der Streit an die zuständige Gerichts- oder Schiedsstelle gemäß geltendem Recht verwiesen.</p><p>35. Maßgebliche Sprache: Bei Widersprüchen zwischen der arabischen Version dieser Vereinbarung und einer übersetzten Version ist die arabische Version die maßgebliche rechtliche Referenz.</p><p>36. Mitteilungen: Alle offiziellen Mitteilungen gemäß dieser Vereinbarung werden an die vom Botschafter bei der Registrierung angegebenen Kontaktdaten gesendet; der Botschafter ist für deren Aktualisierung verantwortlich.</p><p>37. Kein stillschweigender Verzicht: Die Nichtausübung eines Rechts durch das Unternehmen aus dieser Vereinbarung bei einer bestimmten Gelegenheit stellt keinen Verzicht auf dieses Recht in der Zukunft dar.</p><p>38. Geschäftsfähigkeit: Der Botschafter bestätigt, das gesetzliche Alter zum Abschluss von Verträgen in seinem Wohnsitzland erreicht zu haben und dass keine rechtliche Beschränkung ihn am Abschluss dieser Vereinbarung hindert.</p><p>39. Unabhängigkeit vom Anlageberatung: Die Registrierung als Botschafter oder der Erhalt von Provisionen steht in keinerlei Zusammenhang mit der Qualität oder Genauigkeit der vom Unternehmen bereitgestellten Signale oder Werkzeuge; dies sind zwei völlig unabhängige Systeme.</p><p>40. Kontosperrung wegen Inaktivität: Bringt der Botschafter innerhalb von 14 Tagen nach der Registrierung keinen tatsächlich empfohlenen Kunden, oder sind alle zuvor empfohlenen Kundenabonnements ohne derzeit aktiven Kunden beendet, kann das Unternehmen das Konto des Botschafters automatisch bis auf weiteres sperren, ohne dass dies bereits vor der Sperrung tatsächlich verdiente Provisionen berührt.</p><p>41. Abschließende Bestätigung: Durch Klicken auf "Als Botschafter registrieren" und die obige Unterschrift bestätigt der Botschafter, alle obigen Klauseln (1 bis 41) gelesen und vollständig verstanden zu haben, ihnen freiwillig und ohne Zwang zuzustimmen und sich zur vollständigen Einhaltung zu verpflichten.</p>',

es: {
  title:'Regístrate como Embajador de Option Lion', sub:'Gana una comisión fija de 4$ por cada renovación real de suscripción a través de tu código',
  name:'Nombre a mostrar', legalName:'Nombre legal completo (DNI/Pasaporte)', country:'País', city:'Ciudad', email:'Correo electrónico', age:'Edad',
  phone:'Número de teléfono', tg:'Cuenta de Telegram', code:'Tu código de referido', codeHint:'Elige un código no usado por otro embajador — lo verificaremos automáticamente.',
  bank:'Número de cuenta bancaria (IBAN o número de cuenta)', bankHint:'El IBAN es común en Arabia Saudita y la mayoría de países — si no tienes uno, ingresa tu número de cuenta normal.',
  agreePrefix:'Confirmo que he leído el', agreeLink:'Acuerdo de Embajadores de Option Lion', agreeSuffix:'y acepto todos sus términos.',
  sig:'Firma (dibuja con el dedo o el ratón)', clearSig:'Borrar firma', submit:'Registrarme como Embajador',
  thanksTitle:'Registro exitoso', thanksBody:function(code){return 'Tu código <b style="color:#D4AF37;">'+code+'</b> ya está listo — compártelo y gana 4$ por cada renovación real.';},
  agreementTitle:'Acuerdo de Embajadores de Option Lion',
  agreementBody:'<p>Preámbulo: Este Acuerdo rige la relación contractual entre la administración de Option Lion ("la Empresa") y la persona registrada como embajador de marketing ("el Embajador"). La aceptación electrónica constituye un contrato plenamente vinculante entre ambas partes.</p><p>1. Definiciones: "Código de Embajador" es el código único asignado al Embajador para rastrear referidos; "Cliente Referido" es todo usuario que completa una suscripción realmente pagada usando ese código.</p><p>2. Naturaleza de la Relación: Este Acuerdo no crea ninguna relación laboral, de agencia o de sociedad entre las partes; el Embajador es un contratista totalmente independiente sin autoridad para actuar en nombre de la Empresa ni obligarla de ninguna forma.</p><p>3. Comisión: El Embajador gana una comisión fija de 4$ (cuatro dólares estadounidenses) por cada renovación de suscripción real y totalmente pagada a través de su código. No se genera comisión por periodos de prueba gratuitos ni por pagos cancelados o reembolsados.</p><p>4. Mecanismo de Pago: Las comisiones adeudadas se pagan periódicamente mediante el método de comunicación y transferencia acordado (Telegram o cuenta bancaria registrada). La Empresa asume solo los costos directos de transferencia salvo acuerdo distinto.</p><p>5. Exactitud de los Datos: El Embajador confirma que todos los datos proporcionados (nombre, nacionalidad, datos de contacto, cuenta bancaria) son exactos y actuales al momento del registro, y asume la responsabilidad exclusiva por cualquier daño derivado de datos inexactos o engañosos.</p><p>6. Carácter Personal de la Cuenta: La cuenta y el código del Embajador son estrictamente personales y no pueden transferirse, cederse ni compartirse con terceros sin consentimiento previo por escrito de la Empresa.</p><p>7. Prohibición de Métodos de Promoción Indebidos: El Embajador no utilizará métodos de promoción engañosos, falsos o ilegales, incluyendo, entre otros, mensajes no solicitados (spam), promesas falsas de ganancias garantizadas o suplantación de la Empresa.</p><p>8. Prohibición de Conflicto de Intereses: El Embajador no podrá registrar más de un código a su nombre ni usar el código de otro embajador para obtener doble comisión por el mismo cliente.</p><p>9. Propiedad Intelectual: Todas las marcas, logotipos, nombres y contenidos de Option Lion son propiedad exclusiva de la Empresa. La firma de este Acuerdo no otorga al Embajador ningún derecho de propiedad ni licencia permanente de uso más allá de la promoción autorizada.</p><p>10. Uso Permitido de la Marca: El Embajador puede usar el nombre y logotipo de Option Lion únicamente para promocionar directamente su código; queda prohibido modificar el logotipo o usarlo de forma que sugiera una asociación oficial inexistente.</p><p>11. Confidencialidad: El Embajador se compromete a mantener la confidencialidad de cualquier información no pública a la que acceda en su función (datos de clientes, mecanismos internos de precios, estadísticas de desempeño) y a no divulgarla a terceros.</p><p>12. Protección de Datos de Clientes: Se prohíbe al Embajador recopilar, almacenar o usar datos personales de clientes referidos más allá de lo que proporciona el panel oficial, debiendo cumplir con las normativas de protección de datos aplicables.</p><p>13. Derecho de Suspensión y Cancelación: La Empresa se reserva el derecho absoluto de suspender o cancelar de inmediato cualquier código de embajador sin previo aviso ante la comprobación de una infracción de cualquier cláusula de este Acuerdo.</p><p>14. Efecto de la Cancelación sobre las Comisiones: Al cancelar la cuenta por incumplimiento sustancial (fraude, suplantación), se pierden las comisiones adeudadas no pagadas. La cancelación por causas no sustanciales no anula las comisiones ya ganadas hasta la fecha de cancelación.</p><p>15. Sin Ingreso Mínimo Garantizado: La Empresa no garantiza un número mínimo de referidos ni un monto de comisión; el ingreso depende exclusivamente del esfuerzo de marketing propio del Embajador.</p><p>16. Responsabilidad Fiscal: El Embajador es el único responsable de declarar cualquier ingreso obtenido bajo este Acuerdo ante las autoridades fiscales competentes de su país. La Empresa no asume ninguna obligación fiscal en su nombre.</p><p>17. Exención de Responsabilidad sobre Decisiones de Trading: El Embajador no está autorizado a dar asesoría o recomendación de inversión en nombre de la Empresa; cualquier contenido personal que ofrezca no se considera emitido por la Empresa, que no asume responsabilidad alguna por ello.</p><p>18. Indemnización: El Embajador se compromete a indemnizar a la Empresa por cualquier daño, pérdida o reclamación legal derivada de su incumplimiento de este Acuerdo o de su conducta al promocionar el servicio.</p><p>19. Limitación de Responsabilidad: La responsabilidad máxima de la Empresa frente al Embajador bajo este Acuerdo no excederá el total de comisiones adeudadas y no pagadas al momento de cualquier disputa.</p><p>20. Fuerza Mayor: La Empresa no será responsable por ningún retraso o incumplimiento de sus obligaciones derivado de circunstancias fuera de su control (fallas técnicas graves, desastres naturales o cambios regulatorios repentinos).</p><p>21. Vigencia: Este Acuerdo entra en vigor desde la fecha de aceptación electrónica por tiempo indefinido; cualquiera de las partes puede darlo por terminado en cualquier momento mediante aviso escrito por Telegram.</p><p>22. Derecho de Modificación: La Empresa se reserva el derecho de modificar los términos de comisión o las cláusulas de este Acuerdo en cualquier momento; se notificará al Embajador de cambios sustanciales, y continuar actuando como embajador tras la notificación constituye aceptación implícita.</p><p>23. Prohibición de Cesión: El Embajador no podrá ceder sus derechos u obligaciones bajo este Acuerdo a terceros sin consentimiento escrito de la Empresa.</p><p>24. Divisibilidad: Si alguna disposición de este Acuerdo resulta inválida o inaplicable, las demás disposiciones permanecerán en pleno vigor y efecto.</p><p>25. Acuerdo Íntegro: Este documento constituye el acuerdo íntegro entre las partes respecto al programa de embajadores y sustituye cualquier entendimiento o promesa verbal previa.</p><p>26. Validez de la Firma Electrónica: El Embajador reconoce que su firma electrónica (dibujada digitalmente) en este formulario tiene la misma fuerza y efecto legal que una firma manuscrita y no podrá ser repudiada posteriormente.</p><p>27. Registro de Consentimiento: La Empresa mantiene un registro electrónico que documenta la fecha, hora y datos proporcionados en el consentimiento del Embajador como prueba utilizable en cualquier disputa.</p><p>28. Comunicación Oficial: La comunicación a través de la cuenta de Telegram registrada es el canal oficialmente reconocido entre las partes para cualquier aviso o reclamación relacionada con este Acuerdo.</p><p>29. No Exclusividad: Este Acuerdo no es exclusivo; la Empresa puede contratar a un número ilimitado de embajadores sin obligación de otorgar preferencia o exclusividad geográfica a ningún embajador.</p><p>30. Prohibición de Autorreferencia: El Embajador no podrá usar su propio código para suscribirse a sí mismo o a una cuenta de su propiedad con el fin de obtener comisión sobre su propia suscripción.</p><p>31. Derecho de Auditoría: La Empresa podrá revisar y auditar cualquier actividad promocional o referidos vinculados al código del Embajador para verificar el cumplimiento de este Acuerdo.</p><p>32. Fraude y Referidos Falsos: Cualquier intento de generar referidos falsos, usar cuentas falsas u otros medios fraudulentos anula de inmediato el derecho del Embajador a cualquier comisión y conlleva la cancelación definitiva de su cuenta.</p><p>33. Ley Aplicable: Este Acuerdo se rige e interpreta conforme a las leyes del Reino de Arabia Saudita, sin perjuicio de otras disposiciones legales obligatorias que puedan aplicar en el país de residencia del Embajador.</p><p>34. Resolución de Disputas: Las partes procurarán primero resolver amistosamente cualquier disputa mediante comunicación directa; de no lograrse, la disputa se someterá a la autoridad judicial o arbitral competente conforme a la normativa vigente.</p><p>35. Idioma Vigente: En caso de conflicto entre la versión árabe de este Acuerdo y cualquier versión traducida, la versión árabe será la referencia legal autorizada.</p><p>36. Notificaciones: Cualquier notificación oficial bajo este Acuerdo se enviará a los datos de contacto proporcionados por el Embajador al registrarse; el Embajador es responsable de mantenerlos actualizados.</p><p>37. Sin Renuncia Implícita: El hecho de que la Empresa no ejerza algún derecho bajo este Acuerdo en una ocasión no constituye una renuncia a dicho derecho en el futuro.</p><p>38. Capacidad Legal: El Embajador confirma haber alcanzado la edad legal para celebrar contratos en su país de residencia y que ninguna restricción legal le impide celebrar este Acuerdo.</p><p>39. Independencia de la Asesoría de Inversión: El registro como embajador o la obtención de comisiones no está vinculado de ninguna forma a la calidad o precisión de las señales o herramientas proporcionadas por la Empresa; son dos sistemas totalmente independientes.</p><p>40. Congelación de Cuenta por Inactividad: Si el Embajador no logra ningún cliente referido real dentro de los 14 días posteriores al registro, o si todas las suscripciones de clientes referidos previamente han finalizado sin ningún cliente actualmente activo, la Empresa podrá congelar automáticamente la cuenta del Embajador hasta nuevo aviso, sin que ello afecte a las comisiones realmente ganadas antes de la congelación.</p><p>41. Reconocimiento Final: Al hacer clic en "Registrarme como Embajador" y firmar arriba, el Embajador reconoce haber leído y comprendido plenamente todas las cláusulas anteriores (de la 1 a la 41), las acepta voluntariamente y sin coacción, y se compromete a su pleno cumplimiento.</p>',

  agreementTitle:'Acordo de Embaixadores da Option Lion',
  agreementBody:'<p>Preâmbulo: Este Acordo rege a relação contratual entre a administração da Option Lion ("a Empresa") e a pessoa registrada como embaixador de marketing ("o Embaixador"). A aceitação eletrônica constitui um contrato totalmente vinculativo entre ambas as partes.</p><p>1. Definições: "Código de Embaixador" é o código único atribuído ao Embaixador para rastrear indicações; "Cliente Indicado" é qualquer usuário que conclua uma assinatura efetivamente paga usando esse código.</p><p>2. Natureza da Relação: Este Acordo não cria qualquer relação de emprego, agência ou sociedade entre as partes; o Embaixador é um contratado totalmente independente, sem autoridade para agir em nome da Empresa ou vinculá-la de qualquer forma.</p><p>3. Comissão: O Embaixador ganha uma comissão fixa de 4$ (quatro dólares americanos) por cada renovação de assinatura real e totalmente paga através do seu código. Não há comissão sobre períodos de teste gratuito nem sobre pagamentos cancelados ou reembolsados.</p><p>4. Mecanismo de Pagamento: As comissões devidas são pagas periodicamente pelo método de comunicação e transferência acordado (Telegram ou conta bancária registrada). A Empresa arca apenas com os custos diretos de transferência, salvo acordo em contrário.</p><p>5. Exatidão dos Dados: O Embaixador confirma que todos os dados enviados (nome, nacionalidade, dados de contato, conta bancária) são precisos e atuais no momento do registro, e assume total responsabilidade por qualquer dano decorrente de dados incorretos ou enganosos.</p><p>6. Caráter Pessoal da Conta: A conta e o código do Embaixador são estritamente pessoais e não podem ser transferidos, cedidos ou compartilhados com terceiros sem consentimento prévio por escrito da Empresa.</p><p>7. Proibição de Métodos de Promoção Indevidos: O Embaixador não deve usar métodos de promoção enganosos, falsos ou ilegais, incluindo, entre outros, mensagens não solicitadas (spam), promessas falsas de lucro garantido ou personificação da Empresa.</p><p>8. Proibição de Conflito de Interesses: O Embaixador não pode registrar mais de um código em seu nome nem usar o código de outro embaixador para obter dupla comissão pelo mesmo cliente.</p><p>9. Propriedade Intelectual: Todas as marcas, logotipos, nomes e conteúdos da Option Lion são propriedade exclusiva da Empresa. A assinatura deste Acordo não concede ao Embaixador nenhum direito de propriedade ou licença permanente de uso além da promoção autorizada.</p><p>10. Uso Permitido da Marca: O Embaixador pode usar o nome e o logotipo da Option Lion apenas para promover diretamente seu código; é proibido modificar o logotipo ou usá-lo de forma que sugira uma parceria oficial inexistente.</p><p>11. Confidencialidade: O Embaixador compromete-se a manter confidencial qualquer informação não pública a que tenha acesso em razão de sua função (dados de clientes, mecanismos internos de preços, estatísticas de desempenho) e a não divulgá-la a terceiros.</p><p>12. Proteção de Dados de Clientes: É proibido ao Embaixador coletar, armazenar ou usar dados pessoais de clientes indicados além do que o painel oficial fornece, devendo cumprir as normas de proteção de dados aplicáveis.</p><p>13. Direito de Suspensão e Cancelamento: A Empresa reserva-se o direito absoluto de suspender ou cancelar imediatamente qualquer código de embaixador, sem aviso prévio, mediante comprovação de violação de qualquer cláusula deste Acordo.</p><p>14. Efeito do Cancelamento sobre Comissões: Ao cancelar a conta por violação material (fraude, personificação), quaisquer comissões devidas não pagas são perdidas. O cancelamento por motivos não materiais não anula as comissões já ganhas até a data do cancelamento.</p><p>15. Sem Renda Mínima Garantida: A Empresa não garante um número mínimo de indicações ou valor de comissão; o rendimento depende exclusivamente do esforço de marketing do próprio Embaixador.</p><p>16. Responsabilidade Fiscal: O Embaixador é o único responsável por declarar qualquer renda obtida sob este Acordo às autoridades fiscais competentes de seu país. A Empresa não assume nenhuma obrigação fiscal em seu nome.</p><p>17. Isenção de Responsabilidade sobre Decisões de Negociação: O Embaixador não está autorizado a fornecer qualquer aconselhamento ou recomendação de investimento em nome da Empresa; qualquer conteúdo pessoal que forneça não é considerado emitido pela Empresa, que não assume responsabilidade por ele.</p><p>18. Indenização: O Embaixador compromete-se a indenizar a Empresa por qualquer dano, perda ou reclamação legal decorrente de sua violação deste Acordo ou de sua conduta ao promover o serviço.</p><p>19. Limitação de Responsabilidade: A responsabilidade máxima da Empresa perante o Embaixador nos termos deste Acordo não excederá o total de comissões devidas e não pagas no momento de qualquer disputa.</p><p>20. Força Maior: A Empresa não será responsável por qualquer atraso ou falha no cumprimento de suas obrigações decorrente de circunstâncias fora de seu controle (falhas técnicas graves, desastres naturais ou mudanças regulatórias repentinas).</p><p>21. Vigência: Este Acordo entra em vigor a partir da data de aceitação eletrônica por prazo indeterminado; qualquer das partes pode rescindi-lo a qualquer momento mediante aviso por escrito via Telegram.</p><p>22. Direito de Alteração: A Empresa reserva-se o direito de alterar os termos de comissão ou as cláusulas deste Acordo a qualquer momento; o Embaixador será notificado de alterações materiais, e a continuidade de sua atuação após a notificação constitui aceitação implícita.</p><p>23. Proibição de Cessão: O Embaixador não pode ceder seus direitos ou obrigações sob este Acordo a terceiros sem consentimento por escrito da Empresa.</p><p>24. Divisibilidade: Caso qualquer disposição deste Acordo seja considerada inválida ou inexequível, as demais disposições permanecerão em pleno vigor e efeito.</p><p>25. Acordo Integral: Este documento constitui o acordo integral entre as partes quanto ao programa de embaixadores e substitui quaisquer entendimentos ou promessas verbais anteriores.</p><p>26. Validade da Assinatura Eletrônica: O Embaixador reconhece que sua assinatura eletrônica (desenhada digitalmente) neste formulário tem a mesma força e efeito legal de uma assinatura manuscrita e não pode ser posteriormente repudiada.</p><p>27. Registro de Consentimento: A Empresa mantém um registro eletrônico documentando data, hora e dados fornecidos no consentimento do Embaixador como prova utilizável em qualquer disputa.</p><p>28. Comunicação Oficial: A comunicação através da conta de Telegram registrada é o canal oficialmente reconhecido entre as partes para qualquer aviso ou reclamação relacionada a este Acordo.</p><p>29. Não Exclusividade: Este Acordo não é exclusivo; a Empresa pode contratar um número ilimitado de embaixadores sem qualquer obrigação de conceder preferência ou exclusividade geográfica a qualquer embaixador.</p><p>30. Proibição de Autoindicação: O Embaixador não pode usar seu próprio código para se inscrever ou inscrever uma conta de sua propriedade a fim de obter comissão sobre sua própria assinatura.</p><p>31. Direito de Auditoria: A Empresa pode revisar e auditar qualquer atividade promocional ou indicações vinculadas ao código do Embaixador para verificar a conformidade com este Acordo.</p><p>32. Fraude e Indicações Falsas: Qualquer tentativa de gerar indicações falsas, usar contas falsas ou outros meios fraudulentos anula imediatamente o direito do Embaixador a qualquer comissão e resulta no cancelamento definitivo da conta.</p><p>33. Lei Aplicável: Este Acordo é regido e interpretado de acordo com as leis do Reino da Arábia Saudita, sem prejuízo de outras disposições legais obrigatórias que possam se aplicar no país de residência do Embaixador.</p><p>34. Resolução de Disputas: As partes buscarão primeiro resolver amigavelmente qualquer disputa por meio de comunicação direta; não sendo possível, a disputa será submetida à autoridade judicial ou arbitral competente conforme a regulamentação aplicável.</p><p>35. Idioma Oficial: Em caso de conflito entre a versão árabe deste Acordo e qualquer versão traduzida, a versão árabe será a referência legal oficial.</p><p>36. Notificações: Quaisquer notificações oficiais nos termos deste Acordo serão enviadas aos dados de contato fornecidos pelo Embaixador no registro; o Embaixador é responsável por mantê-los atualizados.</p><p>37. Sem Renúncia Implícita: A não utilização de qualquer direito pela Empresa nos termos deste Acordo em uma ocasião não constitui renúncia a esse direito no futuro.</p><p>38. Capacidade Legal: O Embaixador confirma ter atingido a idade legal para celebrar contratos em seu país de residência e que nenhuma restrição legal o impede de celebrar este Acordo.</p><p>39. Independência de Aconselhamento de Investimento: O registro como embaixador ou o recebimento de comissões não está de forma alguma vinculado à qualidade ou precisão dos sinais ou ferramentas fornecidos pela Empresa; são dois sistemas totalmente independentes.</p><p>40. Congelamento de Conta por Inatividade: Se o Embaixador não conseguir nenhum cliente indicado real dentro de 14 dias a partir do registro, ou se todas as assinaturas de clientes previamente indicados tiverem terminado sem nenhum cliente atualmente ativo, a Empresa poderá congelar automaticamente a conta do Embaixador até novo aviso, sem afetar quaisquer comissões efetivamente ganhas antes do congelamento.</p><p>41. Reconhecimento Final: Ao clicar em "Registrar como Embaixador" e assinar acima, o Embaixador reconhece ter lido e compreendido totalmente todas as cláusulas acima (de 1 a 41), concorda com elas voluntariamente e sem coação, e compromete-se ao cumprimento integral.</p>',

  agreementTitle:'Option Lion Elçi Sözleşmesi',
  agreementBody:'<p>Giriş: Bu Sözleşme, Option Lion yönetimi ("Şirket") ile pazarlama elçisi olarak kayıtlı kişi ("Elçi") arasındaki sözleşmesel ilişkiyi düzenler. Elektronik kabul, taraflar arasında tam bağlayıcı bir sözleşme oluşturur.</p><p>1. Tanımlar: "Elçi Kodu", yönlendirmeleri takip etmek için Elçiye atanan benzersiz kodu ifade eder; "Yönlendirilen Müşteri", bu kod aracılığıyla gerçekten ödenmiş bir aboneliği tamamlayan her kullanıcıyı ifade eder.</p><p>2. İlişkinin Niteliği: Bu Sözleşme, taraflar arasında herhangi bir istihdam, temsilcilik veya ortaklık ilişkisi kurmaz; Elçi tamamen bağımsız bir yüklenicidir ve Şirket adına hareket etme veya onu bağlama yetkisine sahip değildir.</p><p>3. Komisyon: Elçi, kodu üzerinden yapılan her gerçek ve tamamen ödenmiş abonelik yenilemesi başına sabit 4$ (dört ABD doları) komisyon kazanır. Ücretsiz deneme süreleri ile iptal edilen veya iade edilen ödemeler için komisyon tahakkuk etmez.</p><p>4. Ödeme Mekanizması: Tahakkuk eden komisyonlar, üzerinde anlaşılan iletişim ve transfer yöntemi (Telegram veya kayıtlı banka hesabı) aracılığıyla periyodik olarak ödenir. Aksi kararlaştırılmadıkça Şirket yalnızca doğrudan transfer maliyetlerini üstlenir.</p><p>5. Veri Doğruluğu: Elçi, kayıt sırasında sunulan tüm verilerin (isim, uyruk, iletişim bilgileri, banka hesabı) doğru ve güncel olduğunu teyit eder ve yanlış veya yanıltıcı verilerden kaynaklanan her türlü zarardan tek başına sorumludur.</p><p>6. Hesabın Kişisel Niteliği: Elçinin hesabı ve kodu tamamen kişiseldir ve Şirketin önceden yazılı onayı olmadan devredilemez, temlik edilemez veya üçüncü taraflarla paylaşılamaz.</p><p>7. Yasak Tanıtım Yöntemleri: Elçi, istenmeyen mesajlar (spam), yanlış kâr garantisi iddiaları veya Şirket kimliğine bürünme dahil ancak bunlarla sınırlı olmamak üzere yanıltıcı, sahte veya yasa dışı herhangi bir tanıtım yöntemi kullanamaz.</p><p>8. Çıkar Çatışması Yasağı: Elçi, kendi adına birden fazla kod kaydedemez ve aynı müşteri için çifte komisyon almak amacıyla başka bir elçinin kodunu kullanamaz.</p><p>9. Fikri Mülkiyet: Option Lion\'a ait tüm ticari markalar, logolar, isimler ve içerikler münhasıran Şirkete aittir. Bu Sözleşmenin imzalanması, Elçiye yetkili tanıtım kapsamı dışında herhangi bir mülkiyet hakkı veya kalıcı kullanım lisansı vermez.</p><p>10. İzin Verilen Marka Kullanımı: Elçi, Option Lion adını ve logosunu yalnızca kendi kodunu doğrudan tanıtmak amacıyla kullanabilir; logonun değiştirilmesi veya var olmayan resmi bir ortaklığı ima edecek şekilde kullanılması yasaktır.</p><p>11. Gizlilik: Elçi, görevi gereği edindiği herkese açık olmayan bilgileri (müşteri verileri, dahili fiyatlandırma mekanizmaları, performans istatistikleri) gizli tutmayı ve üçüncü taraflara ifşa etmemeyi taahhüt eder.</p><p>12. Müşteri Verilerinin Korunması: Elçinin, resmi kontrol panelinin sağladığının ötesinde yönlendirilen müşterilerin kişisel verilerini toplaması, saklaması veya kullanması yasaktır ve geçerli kişisel veri koruma düzenlemelerine uyması gerekir.</p><p>13. Askıya Alma ve Fesih Hakkı: Şirket, bu Sözleşmenin herhangi bir maddesinin ihlal edildiğinin kanıtlanması halinde, önceden bildirimde bulunmaksızın herhangi bir elçi kodunu derhal askıya alma veya feshetme hakkını saklı tutar.</p><p>14. Feshin Komisyonlara Etkisi: Önemli bir ihlal (dolandırıcılık, kimliğe bürünme) nedeniyle hesabın feshedilmesi durumunda, ödenmemiş tahakkuk eden komisyonlar kaybedilir. Önemli olmayan nedenlerle fesih, fesih tarihine kadar fiilen kazanılan komisyonları geçersiz kılmaz.</p><p>15. Garanti Edilen Asgari Gelir Yok: Şirket, asgari bir yönlendirme sayısı veya komisyon tutarı garanti etmez; kazanç tamamen Elçinin kendi pazarlama çabasına bağlıdır.</p><p>16. Vergi Sorumluluğu: Elçi, bu Sözleşme kapsamında elde ettiği herhangi bir geliri kendi ülkesindeki ilgili vergi makamlarına bildirmekten tek başına sorumludur. Şirket, onun adına herhangi bir vergi yükümlülüğü üstlenmez.</p><p>17. İşlem Kararları Hakkında Sorumluluk Reddi: Elçi, Şirket adına herhangi bir yatırım tavsiyesi veya önerisi vermeye yetkili değildir; kişisel olarak sunduğu herhangi bir içerik Şirket tarafından verilmiş sayılmaz ve Şirket bundan sorumlu tutulamaz.</p><p>18. Tazminat: Elçi, bu Sözleşmeyi ihlalinden veya hizmeti tanıtırken sergilediği davranışlardan kaynaklanan her türlü zarar, kayıp veya yasal talepten dolayı Şirketi tazmin etmeyi kabul eder.</p><p>19. Sorumluluk Sınırlaması: Şirketin bu Sözleşme kapsamında Elçiye karşı azami sorumluluğu, herhangi bir uyuşmazlık anında tahakkuk etmiş ancak ödenmemiş toplam komisyon tutarını aşamaz.</p><p>20. Mücbir Sebep: Şirket, kontrolü dışındaki koşullardan (büyük teknik arızalar, doğal afetler veya ani düzenleyici değişiklikler) kaynaklanan yükümlülüklerini yerine getirmedeki herhangi bir gecikme veya başarısızlıktan sorumlu tutulamaz.</p><p>21. Süre: Bu Sözleşme, elektronik kabul tarihinden itibaren süresiz olarak yürürlüktedir; taraflardan herhangi biri, Telegram üzerinden yazılı bildirimle her zaman feshedebilir.</p><p>22. Değişiklik Hakkı: Şirket, komisyon şartlarını veya bu Sözleşmenin maddelerini her zaman değiştirme hakkını saklı tutar; Elçiye önemli değişiklikler bildirilir ve bildirimden sonra elçi olarak faaliyete devam etmesi zımni kabul sayılır.</p><p>23. Devir Yasağı: Elçi, bu Sözleşme kapsamındaki hak veya yükümlülüklerini Şirketin yazılı onayı olmadan üçüncü taraflara devredemez.</p><p>24. Bölünebilirlik: Bu Sözleşmenin herhangi bir hükmünün geçersiz veya uygulanamaz olması halinde, diğer hükümler tam olarak yürürlükte kalmaya devam eder.</p><p>25. Sözleşmenin Bütünlüğü: Bu belge, elçi programına ilişkin taraflar arasındaki eksiksiz anlaşmayı oluşturur ve önceki sözlü anlayış veya vaatlerin yerini alır.</p><p>26. Elektronik İmzanın Geçerliliği: Elçi, bu formdaki elektronik (dijital olarak çizilmiş) imzasının el yazısıyla atılan bir imza ile aynı yasal güç ve etkiye sahip olduğunu ve daha sonra reddedilemeyeceğini kabul eder.</p><p>27. Onay Kaydı: Şirket, herhangi bir uyuşmazlıkta kullanılabilir kanıt olarak Elçinin onayının tarihini, saatini ve sunulan verilerini belgeleyen elektronik bir kayıt tutar.</p><p>28. Resmi İletişim: Kayıtlı Telegram hesabı üzerinden yapılan iletişim, bu Sözleşme ile ilgili herhangi bir bildirim veya talep için taraflar arasında resmi olarak tanınan kanaldır.</p><p>29. Münhasır Olmama: Bu Sözleşme münhasır değildir; Şirket, herhangi bir elçiye tercih veya coğrafi münhasırlık verme yükümlülüğü olmaksızın sınırsız sayıda elçiyle sözleşme yapabilir.</p><p>30. Kendi Kendine Yönlendirme Yasağı: Elçi, kendi aboneliği üzerinden komisyon kazanmak amacıyla kendi kodunu kendisini veya sahip olduğu bir hesabı abone yapmak için kullanamaz.</p><p>31. Denetim Hakkı: Şirket, bu Sözleşmeye uyumu doğrulamak için Elçinin koduyla bağlantılı herhangi bir tanıtım faaliyetini veya yönlendirmeyi inceleme ve denetleme hakkına sahiptir.</p><p>32. Dolandırıcılık ve Sahte Yönlendirmeler: Sahte yönlendirmeler oluşturma, sahte hesaplar kullanma veya başka herhangi bir hileli yöntem girişimi, Elçinin herhangi bir komisyon hakkını derhal ortadan kaldırır ve hesabın kalıcı olarak feshedilmesiyle sonuçlanır.</p><p>33. Geçerli Hukuk: Bu Sözleşme, Elçinin ikamet ettiği ülkede geçerli olabilecek diğer zorunlu yasal hükümlere halel gelmeksizin, Suudi Arabistan Krallığı yasalarına tabidir ve bu yasalara göre yorumlanır.</p><p>34. Uyuşmazlık Çözümü: Taraflar önce herhangi bir anlaşmazlığı doğrudan iletişim yoluyla dostane bir şekilde çözmeye çalışır; bu mümkün olmazsa, uyuşmazlık geçerli düzenlemeler uyarınca yetkili yargı veya tahkim makamına havale edilir.</p><p>35. Geçerli Dil: Bu Sözleşmenin Arapça versiyonu ile herhangi bir çevrilmiş versiyonu arasında çelişki olması halinde, Arapça versiyon yetkili hukuki referans olacaktır.</p><p>36. Bildirimler: Bu Sözleşme kapsamındaki resmi bildirimler, Elçinin kayıt sırasında sağladığı iletişim bilgilerine gönderilir; bunları güncel tutmak Elçinin sorumluluğundadır.</p><p>37. Zımni Feragat Yok: Şirketin bu Sözleşme kapsamındaki herhangi bir hakkı belirli bir durumda kullanmaması, gelecekte bu haktan feragat ettiği anlamına gelmez.</p><p>38. Hukuki Ehliyet: Elçi, ikamet ettiği ülkede sözleşme yapabilecek yasal yaşa ulaştığını ve bu Sözleşmeyi yapmasını engelleyen hiçbir yasal kısıtlama bulunmadığını teyit eder.</p><p>39. Yatırım Tavsiyesinden Bağımsızlık: Elçi olarak kayıt olmak veya komisyon kazanmak, Şirket tarafından sağlanan sinyallerin veya araçların kalitesi veya doğruluğuyla hiçbir şekilde bağlantılı değildir; bunlar tamamen bağımsız iki sistemdir.</p><p>40. Hareketsizlik Nedeniyle Hesap Dondurma: Elçi, kaydından itibaren 14 gün içinde herhangi bir gerçek yönlendirilen müşteri getirmezse veya önceden yönlendirilen tüm müşterilerin abonelikleri şu anda aktif hiçbir müşteri olmadan sona ermişse, Şirket, dondurmadan önce fiilen kazanılan komisyonları etkilemeksizin, Elçinin hesabını bir sonraki bildirime kadar otomatik olarak dondurabilir.</p><p>40. Son Onay: "Elçi Olarak Kaydol" düğmesine tıklayarak ve yukarıda imzalayarak, Elçi yukarıdaki tüm maddeleri (1\'den 41\'e kadar) okuduğunu ve tamamen anladığını, bunlara gönüllü ve baskı altında kalmadan onay verdiğini ve tam uyum sağlamayı taahhüt ettiğini kabul eder.</p>',

  agreementTitle:'Accord des Ambassadeurs Option Lion',
  agreementBody:'<p>Préambule : Cet Accord régit la relation contractuelle entre la direction d\'Option Lion (« la Société ») et la personne inscrite en tant qu\'ambassadeur marketing (« l\'Ambassadeur »). L\'acceptation électronique constitue un contrat pleinement contraignant entre les deux parties.</p><p>1. Définitions : « Code Ambassadeur » désigne le code unique attribué à l\'Ambassadeur pour suivre les parrainages ; « Client Parrainé » désigne tout utilisateur ayant souscrit un abonnement réellement payé via ce code.</p><p>2. Nature de la Relation : Cet Accord ne crée aucune relation d\'emploi, de mandat ou de partenariat entre les parties ; l\'Ambassadeur est un contractant totalement indépendant sans autorité pour agir au nom de la Société ou l\'engager de quelque manière que ce soit.</p><p>3. Commission : L\'Ambassadeur perçoit une commission fixe de 4$ (quatre dollars américains) par renouvellement d\'abonnement réel et entièrement payé via son code. Aucune commission n\'est due pour les périodes d\'essai gratuites ni pour les paiements annulés ou remboursés.</p><p>4. Mécanisme de Paiement : Les commissions dues sont versées périodiquement selon la méthode de communication et de transfert convenue (Telegram ou compte bancaire enregistré). La Société ne supporte que les frais de transfert directs, sauf accord contraire.</p><p>5. Exactitude des Données : L\'Ambassadeur confirme que toutes les données soumises (nom, nationalité, coordonnées, compte bancaire) sont exactes et à jour au moment de l\'inscription, et assume seul la responsabilité de tout dommage résultant de données inexactes ou trompeuses.</p><p>6. Caractère Personnel du Compte : Le compte et le code de l\'Ambassadeur sont strictement personnels et ne peuvent être transférés, cédés ou partagés avec un tiers sans le consentement écrit préalable de la Société.</p><p>7. Interdiction des Méthodes de Promotion Illicites : L\'Ambassadeur ne doit utiliser aucune méthode de promotion trompeuse, fausse ou illégale, y compris, sans s\'y limiter, les messages non sollicités (spam), les fausses promesses de profit garanti ou l\'usurpation de l\'identité de la Société.</p><p>8. Interdiction de Conflit d\'Intérêts : L\'Ambassadeur ne peut enregistrer plus d\'un code à son nom, ni utiliser le code d\'un autre ambassadeur pour obtenir une double commission sur le même client.</p><p>9. Propriété Intellectuelle : Toutes les marques, logos, noms et contenus appartenant à Option Lion sont la propriété exclusive de la Société. La signature de cet Accord ne confère à l\'Ambassadeur aucun droit de propriété ni licence permanente d\'utilisation au-delà de la promotion autorisée.</p><p>10. Utilisation Autorisée de la Marque : L\'Ambassadeur peut utiliser le nom et le logo d\'Option Lion uniquement pour promouvoir directement son code ; il est interdit de modifier le logo ou de l\'utiliser d\'une manière suggérant un partenariat officiel inexistant.</p><p>11. Confidentialité : L\'Ambassadeur s\'engage à garder confidentielle toute information non publique obtenue dans le cadre de sa fonction (données clients, mécanismes internes de tarification, statistiques de performance) et à ne pas la divulguer à un tiers.</p><p>12. Protection des Données Clients : Il est interdit à l\'Ambassadeur de collecter, stocker ou utiliser des données personnelles de clients parrainés au-delà de ce que fournit le tableau de bord officiel, et il doit se conformer aux réglementations applicables en matière de protection des données.</p><p>13. Droit de Suspension et de Résiliation : La Société se réserve le droit absolu de suspendre ou de résilier immédiatement tout code d\'ambassadeur sans préavis en cas de preuve de violation de toute clause de cet Accord.</p><p>14. Effet de la Résiliation sur les Commissions : En cas de résiliation pour violation substantielle (fraude, usurpation d\'identité), toute commission due non versée est perdue. Une résiliation pour des motifs non substantiels n\'annule pas les commissions effectivement acquises jusqu\'à la date de résiliation.</p><p>15. Absence de Revenu Minimum Garanti : La Société ne garantit aucun nombre minimum de parrainages ni montant de commission ; le revenu dépend entièrement de l\'effort marketing propre de l\'Ambassadeur.</p><p>16. Responsabilité Fiscale : L\'Ambassadeur est seul responsable de déclarer tout revenu perçu au titre de cet Accord auprès des autorités fiscales compétentes de son pays. La Société n\'assume aucune obligation fiscale en son nom.</p><p>17. Exonération de Responsabilité sur les Décisions de Trading : L\'Ambassadeur n\'est pas autorisé à donner un conseil ou une recommandation d\'investissement au nom de la Société ; tout contenu personnel qu\'il fournit n\'est pas réputé émaner de la Société, qui n\'en assume aucune responsabilité.</p><p>18. Indemnisation : L\'Ambassadeur s\'engage à indemniser la Société de tout dommage, perte ou réclamation légale résultant de sa violation de cet Accord ou de sa conduite lors de la promotion du service.</p><p>19. Limitation de Responsabilité : La responsabilité maximale de la Société envers l\'Ambassadeur au titre de cet Accord ne dépassera pas le total des commissions dues et non versées au moment d\'un litige.</p><p>20. Force Majeure : La Société n\'est pas responsable de tout retard ou manquement à ses obligations résultant de circonstances hors de son contrôle (pannes techniques majeures, catastrophes naturelles ou changements réglementaires soudains).</p><p>21. Durée : Cet Accord prend effet à la date d\'acceptation électronique pour une durée indéterminée ; chaque partie peut le résilier à tout moment par notification écrite via Telegram.</p><p>22. Droit de Modification : La Société se réserve le droit de modifier les conditions de commission ou les clauses de cet Accord à tout moment ; l\'Ambassadeur sera informé des modifications substantielles, et la poursuite de son activité après notification vaut acceptation implicite.</p><p>23. Interdiction de Cession : L\'Ambassadeur ne peut céder ses droits ou obligations au titre de cet Accord à un tiers sans le consentement écrit de la Société.</p><p>24. Divisibilité : Si une disposition de cet Accord s\'avère invalide ou inapplicable, les autres dispositions restent pleinement en vigueur.</p><p>25. Intégralité de l\'Accord : Ce document constitue l\'accord intégral entre les parties concernant le programme d\'ambassadeurs et remplace tout accord ou promesse verbale antérieure.</p><p>26. Validité de la Signature Électronique : L\'Ambassadeur reconnaît que sa signature électronique (dessinée numériquement) sur ce formulaire a la même force et le même effet juridique qu\'une signature manuscrite et ne peut être ultérieurement contestée.</p><p>27. Registre de Consentement : La Société conserve un registre électronique documentant la date, l\'heure et les données soumises lors du consentement de l\'Ambassadeur, utilisable comme preuve en cas de litige.</p><p>28. Communication Officielle : La communication via le compte Telegram enregistré est le canal officiellement reconnu entre les parties pour tout avis ou réclamation lié à cet Accord.</p><p>29. Non-Exclusivité : Cet Accord n\'est pas exclusif ; la Société peut contracter avec un nombre illimité d\'ambassadeurs sans aucune obligation d\'accorder une préférence ou une exclusivité géographique à un ambassadeur.</p><p>30. Interdiction d\'Auto-Parrainage : L\'Ambassadeur ne peut utiliser son propre code pour s\'abonner lui-même ou abonner un compte lui appartenant afin d\'obtenir une commission sur son propre abonnement.</p><p>31. Droit d\'Audit : La Société peut examiner et auditer toute activité promotionnelle ou tout parrainage lié au code de l\'Ambassadeur afin de vérifier la conformité à cet Accord.</p><p>32. Fraude et Faux Parrainages : Toute tentative de générer de faux parrainages, d\'utiliser de faux comptes ou tout autre moyen frauduleux annule immédiatement le droit de l\'Ambassadeur à toute commission et entraîne la résiliation définitive de son compte.</p><p>33. Droit Applicable : Cet Accord est régi et interprété conformément aux lois du Royaume d\'Arabie Saoudite, sans préjudice de toute autre disposition légale impérative pouvant s\'appliquer dans le pays de résidence de l\'Ambassadeur.</p><p>34. Règlement des Litiges : Les parties chercheront d\'abord à résoudre tout litige à l\'amiable par communication directe ; à défaut, le litige sera soumis à l\'autorité judiciaire ou arbitrale compétente conformément à la réglementation applicable.</p><p>35. Langue de Référence : En cas de conflit entre la version arabe de cet Accord et toute version traduite, la version arabe fera foi comme référence juridique.</p><p>36. Notifications : Toute notification officielle au titre de cet Accord sera envoyée aux coordonnées fournies par l\'Ambassadeur lors de son inscription ; il lui incombe de les maintenir à jour.</p><p>37. Absence de Renonciation Implicite : Le fait pour la Société de ne pas exercer un droit prévu par cet Accord à une occasion donnée ne constitue pas une renonciation à ce droit à l\'avenir.</p><p>38. Capacité Juridique : L\'Ambassadeur confirme avoir atteint l\'âge légal pour conclure des contrats dans son pays de résidence et qu\'aucune restriction légale ne l\'empêche de conclure cet Accord.</p><p>39. Indépendance vis-à-vis du Conseil en Investissement : L\'inscription en tant qu\'ambassadeur ou la perception de commissions n\'est aucunement liée à la qualité ou à la précision des signaux ou outils fournis par la Société ; ce sont deux systèmes totalement indépendants.</p><p>40. Gel du Compte pour Inactivité : Si l\'Ambassadeur n\'apporte aucun client réellement parrainé dans les 14 jours suivant son inscription, ou si tous les abonnements de clients précédemment parrainés ont pris fin sans aucun client actuellement actif, la Société peut geler automatiquement le compte de l\'Ambassadeur jusqu\'à nouvel avis, sans que cela n\'affecte les commissions effectivement gagnées avant le gel.</p><p>41. Reconnaissance Finale : En cliquant sur « S\'inscrire comme Ambassadeur » et en signant ci-dessus, l\'Ambassadeur reconnaît avoir lu et pleinement compris toutes les clauses ci-dessus (de 1 à 41), y consent volontairement et sans contrainte, et s\'engage à s\'y conformer intégralement.</p>',

// ── لوحة التوقيع ──
var canvas = document.getElementById('sigPad');
var ctx = canvas.getContext('2d');
ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#0b1220';
var drawing = false, hasSignature = false;
function getPos(e){
  var rect = canvas.getBoundingClientRect();
  var scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
  var clientX = e.touches ? e.touches[0].clientX : e.clientX;
  var clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}
function startDraw(e){ drawing = true; hasSignature = true; var p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); updateSubmitState(); }
function moveDraw(e){ if(!drawing) return; var p = getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
function endDraw(){ drawing = false; }
canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
window.addEventListener('mouseup', endDraw);
canvas.addEventListener('touchstart', startDraw, {passive:false});
canvas.addEventListener('touchmove', moveDraw, {passive:false});
canvas.addEventListener('touchend', endDraw);
function updateSubmitState(){
  var btn = document.getElementById('btnSubmit');
  var agreed = document.getElementById('f_agree').checked;
  if (agreed && hasSignature) {
    btn.disabled = false; btn.style.opacity = '1'; btn.style.cursor = 'pointer';
  } else {
    btn.disabled = true; btn.style.opacity = '.5'; btn.style.cursor = 'not-allowed';
  }
}
document.getElementById('f_agree').addEventListener('change', updateSubmitState);
canvas.addEventListener('mouseup', updateSubmitState);
canvas.addEventListener('touchend', updateSubmitState);
document.getElementById('btnSubmit').disabled = true;
document.getElementById('btnSubmit').style.opacity = '.5';
document.getElementById('btnSubmit').style.cursor = 'not-allowed';

function clearSignature(){ ctx.clearRect(0,0,canvas.width,canvas.height); hasSignature = false; updateSubmitState(); }

var codeCheckTimer;
document.getElementById('f_code').addEventListener('input', function(){
  clearTimeout(codeCheckTimer);
  var val = this.value.trim();
  var status = document.getElementById('codeStatus');
  status.textContent = '';
  if (!val) return;
  codeCheckTimer = setTimeout(function(){ status.textContent = '⏳'; }, 100);
});

function playClickSound(){
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.1);
  } catch(e){}
}

function submitAffiliate(){
  playClickSound();
  var t = T[currentLang];
  var name = document.getElementById('f_name').value.trim();
  var legalName = document.getElementById('f_legal_name').value.trim();
  var country = document.getElementById('f_country').value;
  var city = document.getElementById('f_city').value.trim();
  var email = document.getElementById('f_email').value.trim();
  var age = document.getElementById('f_age').value;
  var cc = document.getElementById('f_cc').value;
  var phone = document.getElementById('f_phone').value.trim();
  var telegram = document.getElementById('f_tg').value.trim();
  var code = document.getElementById('f_code').value.trim().toUpperCase();
  var bankAccount = document.getElementById('f_bank').value.trim();
  var agree = document.getElementById('f_agree').checked;
  var errEl = document.getElementById('formErr');

  if (!name || !legalName || !city || !email || !age || !phone || !telegram || !code || !bankAccount) {
    errEl.textContent = t.requiredErr; errEl.style.display = 'block'; return;
  }
  if (!agree) { errEl.textContent = t.agreeErr; errEl.style.display = 'block'; return; }
  if (!hasSignature) { errEl.textContent = t.sigErr; errEl.style.display = 'block'; return; }
  errEl.style.display = 'none';
  var signature = canvas.toDataURL('image/png');

  fetch('/api/affiliate-register', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name, legalName, country, city, email, age, phone: cc+phone, telegram, code, bankAccount, agreementAccepted: true, signature: signature })
  }).then(function(r){ return r.json(); }).then(function(res){
    if (res.ok) {
      document.getElementById('formCard').style.display = 'none';
      document.getElementById('thanksCard').style.display = 'block';
      document.getElementById('l_thanks_body').innerHTML = t.thanksBody(code);
    } else {
      var errorMsg = res.error || t.serverErr;
      errorMsg = errorMsg.replace('@option_lion', '<a href="https://t.me/option_lion" target="_blank" style="color:#D4AF37; font-weight:800;">@option_lion</a>');
      errEl.innerHTML = errorMsg;
      errEl.style.display = 'block';
    }
  }).catch(function(){
    errEl.textContent = t.serverErr; errEl.style.display = 'block';
  });
}
</script>
