input{width:100%; box-sizing:border-box; padding:13px 16px; border-radius:10px; border:1px solid rgba(212,175,55,.2); background:rgba(0,0,0,.25); color:#fff; font-size:14.5px; direction:ltr; text-align:left; margin-bottom:14px;}
input:focus{outline:none; border-color:#D4AF37;}
button{width:100%; padding:14px; border:none; border-radius:12px; background:linear-gradient(120deg,#D4AF37,#f0cf6c); color:#070d18; font-weight:900; font-size:15px; font-family:inherit; cursor:pointer;}

<body>
<div class="card">
  <div style="text-align:center; margin-bottom:24px;">
    <div style="font-size:30px; margin-bottom:8px;">⚜</div>
    <h1 style="font-size:20px; color:#fff; margin:0 0 6px;">Check Your Subscription Status</h1>
    <p style="font-size:13px; color:#aab3c5; margin:0;">Enter your Membership Number (sent to you by email upon activation)</p>
  </div>
  <input id="tv2" placeholder="TradingView Username" style="margin-bottom:14px;">
  <input id="q" placeholder="Membership Number (e.g. sa1234567)">
  <button onclick="checkStatus()">Check Now</button>
  <div id="result" style="margin-top:20px; display:none;"></div>
  <div id="notFound" style="display:none; color:#ff9b9b; font-size:13.5px; text-align:center; margin-top:16px;">No matching subscription found. Check your details or contact support.</div>
</div>
<script>
function playClickSound(){
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.1);
  } catch(e){}
}

function checkStatus(){
  playClickSound();
  var q = document.getElementById('q').value.trim();
  var tv = document.getElementById('tv2').value.trim();
  if (!q || !tv) { document.getElementById('result').style.display='none'; document.getElementById('notFound').style.display='block'; return; }
  fetch('/api/customer-status?q=' + encodeURIComponent(q) + '&tv=' + encodeURIComponent(tv)).then(function(r){return r.json();}).then(function(res){
    document.getElementById('result').style.display = 'none';
    document.getElementById('notFound').style.display = 'none';
    if (!res.ok || !res.customer) { document.getElementById('notFound').style.display = 'block'; return; }
    var c = res.customer;
    var statusLabels = {"pending_payment":"Payment Not Completed","trial":"Free Trial","canceled":"Canceled","renew_1m":"Monthly Subscriber","renew_3m":"3-Month Subscriber","renew_6m":"6-Month Subscriber","renew_1y":"Yearly Subscriber"};
    var expiry = c.expires_at ? new Date(c.expires_at).toLocaleString('en-US') : '-';
    document.getElementById('result').innerHTML =
      '<div class="row"><span>Name</span><span>'+c.customer_name+'</span></div>' +
      '<div class="row"><span>Status</span><span>'+(statusLabels[c.status]||c.status)+'</span></div>' +
      '<div class="row"><span>Plan</span><span>'+(c.plan||'-')+'</span></div>' +
      '<div class="row"><span>Expiry Date</span><span>'+expiry+'</span></div>';
    document.getElementById('result').style.display = 'block';
  }).catch(function(){ document.getElementById('notFound').style.display = 'block'; });
}
</script>
