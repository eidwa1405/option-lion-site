var CLOCK_PLANS = { 'pri_01m04rf4x0d06y0aeb4m74230v':['⏱ Session Clock','79'] };
var PLAN_MONTHS = { 'pri_01kyhe6m178pfmv5p755mkhpf0':1, 'pri_01kyheh9wpxzfvv1b452h176y3':3, 'pri_01kyhen533mmstsyr1gf81qb94':6, 'pri_01kyherxxbtt9kvb0hgevs3h3n':12 };
function qs(name){
  var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  return m ? decodeURIComponent(m[1].replace(/\+/g,' ')) : '';
}
function fmtDate(d){
  var mm = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + mm + '-' + dd;
}
