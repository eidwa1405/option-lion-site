<!DOCTYPE html>
<html lang="ar" dir="rtl" id="top">
<head>
<meta charset="utf-8">
<script src="ref-capture.js"></script>
<meta name="description" content="التحقق من صحة شهادة تخرّج أكاديمية O P N LIO — أدخل رقم التحقق للتأكد من اسم الخريج وتاريخ التخرّج.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحقق من الشهادة — O P N  LIO</title>
<link rel="icon" type="image/jpeg" href="assets/lion-logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body { margin:0; font-family:'Tajawal',sans-serif; background:#070d18; color:#e9edf5; }
a { color:#D4AF37; text-decoration:none; }
a:hover { color:#f0cf6c; }
::selection { background:#D4AF37; color:#070d18; }
.card { background:linear-gradient(160deg,rgba(212,175,55,.07),rgba(255,255,255,.03)); border:1px solid rgba(212,175,55,.25); border-radius:20px; padding:34px 30px; box-shadow:0 30px 70px rgba(0,0,0,.45); }
input { font-family:inherit; }
input:focus { outline:none; border-color:#D4AF37 !important; box-shadow:0 0 0 3px rgba(212,175,55,.15); }
.btn-gold { background:linear-gradient(120deg,#D4AF37,#f0cf6c); color:#070d18; border:none; border-radius:12px; font-weight:900; cursor:pointer; font-family:inherit; padding:14px; }
</style>
<meta property="og:type" content="website">
<meta property="og:site_name" content="O P N LIO">
<meta property="og:title" content="التحقق من الشهادة — O P N  LIO">
<meta property="og:image" content="https://opnlio.com/assets/og-card.jpg">
<meta property="og:url" content="https://opnlio.com/verify-cert">
<link rel="canonical" href="https://opnlio.com/verify-cert.html">
</head>
<body>
<div style="position:relative; overflow:hidden; background:radial-gradient(1200px 700px at 80% -10%, rgba(212,175,55,.14), transparent 60%), radial-gradient(900px 600px at 0% 10%, rgba(30,58,110,.5), transparent 60%), #070d18; min-height:100vh;">

<nav style="position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px clamp(16px,5vw,64px); background:rgba(7,13,24,.85); backdrop-filter:blur(14px); border-bottom:1px solid rgba(212,175,55,.18);">
  <a href="./index.html" style="display:flex; align-items:center; gap:10px;">
    <img src="assets/lion-logo.jpg" alt="O P N LIO" style="width:40px; height:40px; border-radius:50%; object-fit:cover; border:1.5px solid #D4AF37;">
    <span style="font-weight:900; letter-spacing:.5px; color:#f4f0e4; white-space:nowrap;"><span style="font-size:22px;">O</span> <span style="font-size:24px;">P</span> <span style="font-size:26px;">N</span> <span style="color:#D4AF37; font-size:32px;">LIO</span></span>
  </a>
  <a href="./index.html" style="font-size:13px; font-weight:700; color:#c9d2e3; border:1px solid #2a3348; padding:8px 18px; border-radius:20px;">↩ الرئيسية</a>
</nav>

<section style="padding:clamp(50px,8vw,90px) clamp(20px,6vw,64px);">
  <div style="max-width:480px; margin:0 auto;">
    <div style="text-align:center; margin-bottom:26px;">
      <div style="font-size:40px; margin-bottom:8px;">🎓</div>
      <h1 style="font-size:clamp(24px,4vw,30px); font-weight:900; margin:0 0 10px;">التحقق من صحة الشهادة</h1>
      <p style="color:#aab3c5; font-size:14px; line-height:1.8; margin:0;">أدخل رقم التحقق المطبوع على شهادة تخرّج أكاديمية O P N LIO للتأكد من صحتها.</p>
    </div>

    <div class="card">
      <label style="display:block; font-size:12.5px; font-weight:700; color:#D4AF37; margin-bottom:7px;">رقم التحقق</label>
      <input id="certInput" type="text" placeholder="OPNLIO-000123-4F9A" oninput="this.value=this.value.toUpperCase();" onkeydown="if(event.key==='Enter')doVerify();" style="width:100%; box-sizing:border-box; padding:14px 16px; border-radius:10px; border:1px solid rgba(212,175,55,.25); background:rgba(0,0,0,.25); color:#fff; font-size:15px; letter-spacing:1px; direction:ltr; text-align:left; margin-bottom:16px;">
      <button class="btn-gold" style="width:100%; font-size:15px;" onclick="doVerify()">تحقّق الآن ⚜</button>
      <div id="vResult" style="margin-top:20px;"></div>
    </div>

    <p style="text-align:center; font-size:12px; color:#6b7488; margin-top:22px; line-height:1.8;">محتوى تعليمي — ليس توصية استثمارية. الشهادة تُثبت اجتياز البرنامج التدريبي فقط.</p>
  </div>
</section>
</div>

<script>
var API = '/.netlify/functions/academy-auth';
function doVerify(){
  var num = (document.getElementById('certInput').value || '').trim().toUpperCase();
  var box = document.getElementById('vResult');
  if (!num) { box.innerHTML = '<div style="color:#ff9b9b; font-size:13.5px; font-weight:700;">أدخل رقم التحقق أولاً.</div>'; return; }
  box.innerHTML = '<div style="color:#8a93a8; font-size:13.5px;">جارِ التحقق…</div>';
  fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'verify-cert', certNumber: num }) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res.ok) { box.innerHTML = '<div style="color:#ff9b9b; font-size:13.5px; font-weight:700;">' + (res.error || 'تعذّر التحقق — حاول لاحقاً') + '</div>'; return; }
      if (!res.valid) {
        box.innerHTML = '<div style="border:1px solid rgba(255,107,107,.4); background:rgba(255,107,107,.08); border-radius:14px; padding:18px; text-align:center;"><div style="font-size:32px; margin-bottom:6px;">⚠️</div><div style="color:#ff9b9b; font-weight:900; font-size:16px; margin-bottom:4px;">شهادة غير موثّقة</div><div style="color:#c9d2e3; font-size:13px;">لا يوجد خرّيج بهذا الرقم في سجلات الأكاديمية.</div></div>';
        return;
      }
      var d = res.graduated_at ? new Date(res.graduated_at).toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'}) : '—';
      box.innerHTML = '<div style="border:1px solid rgba(57,255,20,.4); background:rgba(57,255,20,.07); border-radius:14px; padding:22px; text-align:center;">'+
        '<div style="font-size:34px; margin-bottom:6px;">✅</div>'+
        '<div style="color:#39FF14; font-weight:900; font-size:17px; margin-bottom:14px;">شهادة موثّقة رسمياً</div>'+
        '<div style="display:flex; flex-direction:column; gap:10px; text-align:right;">'+
          '<div style="display:flex; justify-content:space-between; gap:12px; font-size:13.5px;"><span style="color:#8a93a8;">اسم الخرّيج</span><b style="color:#fff;">'+res.name+'</b></div>'+
          '<div style="display:flex; justify-content:space-between; gap:12px; font-size:13.5px;"><span style="color:#8a93a8;">تاريخ التخرّج</span><b style="color:#fff;">'+d+'</b></div>'+
          '<div style="display:flex; justify-content:space-between; gap:12px; font-size:13.5px;"><span style="color:#8a93a8;">رقم التحقق</span><b style="color:#D4AF37; direction:ltr;">'+res.cert_number+'</b></div>'+
        '</div></div>';
    })
    .catch(function(){ box.innerHTML = '<div style="color:#ff9b9b; font-size:13.5px; font-weight:700;">تعذّر الاتصال بالخادم — حاول لاحقاً.</div>'; });
}
</script>
</body>
</html>
