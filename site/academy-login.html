<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="description" content="منصة OPN LIO التعليمية لتحليل السوق — أدوات تحليل فني متكاملة على TradingView وبرنامج تأهيل مجاني بـ12 مستوى.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الأكاديمية — O P N  LIO</title>
<link rel="icon" type="image/jpeg" href="assets/lion-logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{margin:0; font-family:'Tajawal',sans-serif; background:#070d18; color:#e9edf5; min-height:100vh;}
a{color:#D4AF37;}
.card{background:linear-gradient(145deg,rgba(255,255,255,.04),rgba(255,255,255,.015)); border:1px solid rgba(212,175,55,.18); border-radius:18px; padding:26px;}
.btn-gold{background:linear-gradient(135deg,#D4AF37,#f0cf6c); color:#1a1408; font-weight:900; border:none; border-radius:12px; padding:14px 26px; font-size:15px; cursor:pointer; font-family:inherit;}
input{width:100%; padding:13px 16px; border-radius:10px; border:1px solid rgba(212,175,55,.25); background:#10141f; color:#fff; font-family:inherit; font-size:14.5px;}
label{display:block; font-size:13px; font-weight:700; color:#D4AF37; margin-bottom:6px;}
</style>
</head>
<body>
<nav style="position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px clamp(16px,5vw,64px); background:rgba(7,13,24,.92); backdrop-filter:blur(10px); border-bottom:1px solid rgba(212,175,55,.15);">
  <a href="./academy.html" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
    <img src="assets/lion-logo.jpg" alt="O P N LIO" style="width:36px; height:36px; border-radius:50%; object-fit:cover; border:1.5px solid #D4AF37;">
    <span style="font-weight:900; color:#f4f0e4; font-size:18px;">أكاديمية <span style="font-weight:900; letter-spacing:.5px; white-space:nowrap;"><span style="color:#f4f0e4; font-size:15px;">O</span> <span style="color:#f4f0e4; font-size:16px;">P</span> <span style="color:#f4f0e4; font-size:17px;">N</span> <span style="color:#D4AF37; font-size:20px;">LIO</span></span></span>
  </a>
  <a href="./academy.html" style="font-size:13px; font-weight:700; color:#c9d2e3; border:1px solid #2a3348; padding:8px 18px; border-radius:20px;">↩ عن البرنامج</a>
</nav>

<div style="max-width:420px; margin:0 auto; padding:60px 20px 80px;">
  <div style="text-align:center; margin-bottom:24px;">
    <h1 style="font-size:24px; font-weight:900; margin:0 0 8px;">ابدأ رحلتك</h1>
    <p style="color:#aab3c5; font-size:14px; margin:0;">سجّل مجاناً أو سجّل دخولك لمتابعة تقدّمك بالأكاديمية</p>
  </div>
  <div class="card">
    <div style="display:flex; gap:8px; margin-bottom:22px;">
      <button id="tabLogin" onclick="showTab('login')" class="btn-gold" style="flex:1; padding:10px;">تسجيل الدخول</button>
      <button id="tabRegister" onclick="showTab('register')" style="flex:1; padding:10px; background:transparent; border:1px solid rgba(212,175,55,.3); color:#c9d2e3; border-radius:12px; font-weight:800; cursor:pointer; font-family:inherit;">تسجيل جديد</button>
    </div>
    <div id="loginForm">
      <div style="margin-bottom:14px;"><label>البريد الإلكتروني</label><input id="li_email" type="email" placeholder="you@example.com"></div>
      <div style="margin-bottom:18px;"><label>كلمة المرور</label><input id="li_pass" type="password"></div>
      <button class="btn-gold" style="width:100%;" onclick="doLogin()">دخول</button>
    </div>
    <div id="registerForm" style="display:none;">
      <div style="margin-bottom:14px;"><label>الاسم</label><input id="re_name" placeholder="اسمك الكامل"></div>
      <div style="margin-bottom:14px;"><label>البريد الإلكتروني</label><input id="re_email" type="email" placeholder="you@example.com"></div>
      <div style="position:absolute; left:-9999px; opacity:0; height:0; overflow:hidden;"><input id="re_hp" type="text" tabindex="-1" autocomplete="off"></div>
      <div style="margin-bottom:14px;"><label>كلمة المرور (6 أحرف فأكثر)</label><input id="re_pass" type="password"></div>
      <label style="display:flex; align-items:flex-start; gap:8px; font-size:12px; color:#aab3c5; font-weight:400; cursor:pointer; margin-bottom:18px;"><input id="re_agree" type="checkbox" style="width:auto; margin-top:3px; accent-color:#D4AF37;"><span>أوافق على <a href="./terms.html" target="_blank">شروط الاستخدام</a> وأتفهم أن المحتوى تعليمي فقط.</span></label>
      <button class="btn-gold" style="width:100%;" onclick="doRegister()">ابدأ مجاناً</button>
    </div>
    <p id="authMsg" style="color:#ff6b6b; font-size:13px; margin:14px 0 0; text-align:center;"></p>
  </div>
</div>

<script>
var API = '/.netlify/functions/academy-auth';

function showTab(t) {
  document.getElementById('loginForm').style.display = t === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = t === 'register' ? 'block' : 'none';
  document.getElementById('tabLogin').style.cssText = t === 'login' ? 'flex:1;padding:10px;background:linear-gradient(135deg,#D4AF37,#f0cf6c);color:#1a1408;font-weight:900;border:none;border-radius:12px;cursor:pointer;font-family:inherit;font-size:15px;' : 'flex:1;padding:10px;background:transparent;border:1px solid rgba(212,175,55,.3);color:#c9d2e3;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit;';
  document.getElementById('tabRegister').style.cssText = t === 'register' ? 'flex:1;padding:10px;background:linear-gradient(135deg,#D4AF37,#f0cf6c);color:#1a1408;font-weight:900;border:none;border-radius:12px;cursor:pointer;font-family:inherit;font-size:15px;' : 'flex:1;padding:10px;background:transparent;border:1px solid rgba(212,175,55,.3);color:#c9d2e3;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit;';
}

function doRegister() {
  var name = document.getElementById('re_name').value.trim();
  var email = document.getElementById('re_email').value.trim();
  var pass = document.getElementById('re_pass').value;
  var agreed = document.getElementById('re_agree').checked;
  var honeypot = document.getElementById('re_hp').value;
  var msg = document.getElementById('authMsg');
  if (honeypot) return; // بوت — تجاهل بصمت
  if (!agreed) { msg.style.color = '#ff6b6b'; msg.textContent = 'يجب الموافقة على شروط الاستخدام أولاً.'; return; }
  fetch(API, { method:'POST', body: JSON.stringify({ action:'register', name, email, password: pass, lang:'ar' }) })
    .then(r=>r.json()).then(function(res){
      if (!res.ok) { msg.style.color = '#ff6b6b'; msg.textContent = res.error; return; }
      msg.style.color = '#39FF14';
      msg.textContent = 'تم التسجيل! سجّل دخولك الآن.';
      showTab('login');
    });
}

function doLogin() {
  var email = document.getElementById('li_email').value.trim();
  var pass = document.getElementById('li_pass').value;
  fetch(API, { method:'POST', body: JSON.stringify({ action:'login', email, password: pass }) })
    .then(r=>r.json()).then(function(res){
      if (!res.ok) {
        document.getElementById('authMsg').style.color='#ff6b6b';
        document.getElementById('authMsg').innerHTML = res.error + (res.needsVerification ? '<br><a href="#" onclick="resendVerify(\''+email+'\'); return false;" style="color:#D4AF37; font-weight:800;">إعادة إرسال رابط التحقق</a>' : '');
        return;
      }
      var s = res; s.expiresAt = Date.now() + 24*60*60*1000;
      localStorage.setItem('opnlio_academy_session', JSON.stringify(s));
      location.href = './academy.html';
    });
}

function resendVerify(email){
  var msg = document.getElementById('authMsg');
  msg.style.color = '#39FF14'; msg.textContent = 'جارٍ الإرسال...';
  fetch(API, { method:'POST', body: JSON.stringify({ action:'resend-verification', email: email }) })
    .then(r=>r.json()).then(function(){
      msg.style.color = '#39FF14';
      msg.textContent = 'تم إرسال رابط جديد (صالح 120 ثانية) — تحقق من بريدك الآن.';
    });
}

if (location.hash === '#register') showTab('register');
</script>
</body>
</html>
