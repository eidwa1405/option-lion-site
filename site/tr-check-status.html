<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abonelik Durumum — Option Lion</title>
<link rel="icon" type="image/jpeg" href="assets/lion-logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{margin:0; font-family:'Tajawal',sans-serif; background:#070d18; color:#e9edf5; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
a{color:#D4AF37;}
.card{background:linear-gradient(160deg,rgba(212,175,55,.07),rgba(255,255,255,.03)); border:1px solid rgba(212,175,55,.25); border-radius:20px; padding:34px 30px; max-width:440px; width:100%;}
input{width:100%; box-sizing:border-box; padding:13px 16px; border-radius:10px; border:1px solid rgba(212,175,55,.2); background:rgba(0,0,0,.25); color:#fff; font-size:14.5px; direction:ltr; text-align:left; margin-bottom:14px;}
input:focus{outline:none; border-color:#D4AF37;}
button{width:100%; padding:14px; border:none; border-radius:12px; background:linear-gradient(120deg,#D4AF37,#f0cf6c); color:#070d18; font-weight:900; font-size:15px; font-family:inherit; cursor:pointer;}
.row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.08); font-size:14px;}
.row span:first-child{color:#8a93a8;}
</style>
</head>
<body>
<div class="card">
  <div style="text-align:center; margin-bottom:24px;">
    <div style="font-size:30px; margin-bottom:8px;">⚜</div>
    <h1 style="font-size:20px; color:#fff; margin:0 0 6px;">Abonelik Durumunuzu Kontrol Edin</h1>
    <p style="font-size:13px; color:#aab3c5; margin:0;">Kayıt sırasında kullandığınız telefon numarasını veya Telegram hesabını girin</p>
  </div>
  <input id="q" placeholder="örn: @username veya 966501234567">
  <button onclick="checkStatus()">Şimdi Kontrol Et</button>
  <div id="result" style="margin-top:20px; display:none;"></div>
  <div id="notFound" style="display:none; color:#ff9b9b; font-size:13.5px; text-align:center; margin-top:16px;">Eşleşen abonelik bulunamadı. Bilgilerinizi kontrol edin veya destekle iletişime geçin.</div>
</div>
<script>
function playClickSound(){
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.1);
  } catch(e){}
}

function checkStatus(){
  playClickSound();
  var q = document.getElementById('q').value.trim();
  if (!q) return;
  fetch('/api/customer-status?q=' + encodeURIComponent(q)).then(function(r){return r.json();}).then(function(res){
    document.getElementById('result').style.display = 'none';
    document.getElementById('notFound').style.display = 'none';
    if (!res.ok || !res.customer) { document.getElementById('notFound').style.display = 'block'; return; }
    var c = res.customer;
    var statusLabels = {"pending_payment":"Ödeme Tamamlanmadı","trial":"Ücretsiz Deneme","canceled":"İptal Edildi","renew_1m":"Aylık Abone","renew_3m":"3 Aylık Abone","renew_6m":"6 Aylık Abone","renew_1y":"Yıllık Abone"};
    var expiry = c.expires_at ? new Date(c.expires_at).toLocaleString('tr-TR') : '-';
    document.getElementById('result').innerHTML =
      '<div class="row"><span>İsim</span><span>'+c.customer_name+'</span></div>' +
      '<div class="row"><span>Durum</span><span>'+(statusLabels[c.status]||c.status)+'</span></div>' +
      '<div class="row"><span>Paket</span><span>'+(c.plan||'-')+'</span></div>' +
      '<div class="row"><span>Bitiş Tarihi</span><span>'+expiry+'</span></div>';
    document.getElementById('result').style.display = 'block';
  }).catch(function(){ document.getElementById('notFound').style.display = 'block'; });
}
</script>
</body>
</html>
