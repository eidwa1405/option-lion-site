<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="utf-8">
<script src="ref-capture.js"></script>
<meta name="description" content="منصة OPN LIO التعليمية لتحليل السوق — أدوات تحليل فني متكاملة على TradingView وبرنامج تأهيل مجاني بـ12 مستوى.">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" type="image/jpeg" href="assets/lion-logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0; font-family:'Tajawal',sans-serif; background:#070d18; color:#e9edf5; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.card{background:linear-gradient(160deg,rgba(212,175,55,.07),rgba(255,255,255,.03)); border:1px solid rgba(212,175,55,.25); border-radius:20px; padding:34px 30px; max-width:400px; width:100%;}
label{display:block; font-size:12.5px; font-weight:700; color:#D4AF37; margin-bottom:7px;}
input{width:100%; box-sizing:border-box; padding:13px 16px; border-radius:10px; border:1px solid rgba(212,175,55,.2); background:rgba(0,0,0,.25); color:#fff; font-size:14.5px; margin-bottom:16px; font-family:inherit;}
button{width:100%; padding:14px; border:none; border-radius:12px; background:linear-gradient(120deg,#D4AF37,#f0cf6c); color:#070d18; font-weight:900; font-size:15px; cursor:pointer;}
#err{display:none; background:rgba(255,60,60,.1); border:1px solid rgba(255,80,80,.4); color:#ff9b9b; font-size:13px; font-weight:600; padding:12px 16px; border-radius:10px; text-align:center; margin-bottom:16px;}
.langDD{position:relative; display:block; margin-bottom:20px; text-align:center;}
.langDDBtn{display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:20px; font-size:13px; font-weight:700; background:rgba(255,255,255,.06); color:#c9cddb; border:1px solid rgba(255,255,255,.15); cursor:pointer; font-family:inherit;}
.langDDMenu{display:none; position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); background:#10141f; border:1px solid #2a3348; border-radius:12px; box-shadow:0 12px 30px rgba(0,0,0,.5); padding:6px; min-width:160px; z-index:100;}
.langDDMenu.open{display:block;}
.langDDMenu button{display:flex; align-items:center; gap:10px; width:100%; padding:9px 14px; font-size:13px; font-weight:600; color:#c9cddb; background:transparent; border:none; cursor:pointer; text-align:right; border-radius:8px; font-family:inherit;}
.langDDMenu button:hover{background:rgba(212,175,55,.12);}
</style>

<meta property="og:type" content="website">
<meta property="og:site_name" content="O P N LIO">
<meta property="og:title" content="O P N LIO ⚜">
<meta property="og:description" content="منصة OPN LIO التعليمية لتحليل السوق — أدوات تحليل فني متكاملة على TradingView وبرنامج تأهيل مجاني بـ12 مستوى.">
<meta property="og:image" content="https://opnlio.com/assets/og-card.jpg">
<meta property="og:url" content="https://opnlio.com/affiliate-login">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://opnlio.com/assets/og-card.jpg">
<link rel="canonical" href="https://opnlio.com/affiliate-login.html">
<script>try{ if (localStorage.getItem("aff_token") && localStorage.getItem("aff_code")) location.replace("./affiliate-dashboard.html"); }catch(e){}</script>
</head>
<body>
<div dir="rtl" style="background:rgba(212,175,55,.1); border-bottom:1px solid rgba(212,175,55,.35); padding:11px 16px; text-align:center; font-family:Tajawal,sans-serif; font-size:12.5px; color:#e9edf5;">🔔 نظام السفراء الجديد أصبح داخل <a href="./member-login.html" style="color:#D4AF37; font-weight:800;">لوحة العضو</a> — هذه اللوحة تبقى لدخول السفراء المسجّلين سابقاً فقط.</div>

<div class="card">
  <div class="langDD" id="langDD">
    <button class="langDDBtn" onclick="toggleLangDD()"><span id="langDDFlag">🇸🇦</span> <span id="langDDLabel">العربية</span> <span style="font-size:9px;">▾</span></button>
    <div class="langDDMenu" id="langDDMenu">
      <button onclick="setLang('ar'); toggleLangDD(false);">🇸🇦 العربية</button>
      <button onclick="setLang('en'); toggleLangDD(false);">🇬🇧 English</button>
      <button onclick="setLang('de'); toggleLangDD(false);">🇩🇪 Deutsch</button>
      <button onclick="setLang('es'); toggleLangDD(false);">🇪🇸 Español</button>
      <button onclick="setLang('pt'); toggleLangDD(false);">🇵🇹 Português</button>
      <button onclick="setLang('tr'); toggleLangDD(false);">🇹🇷 Türkçe</button>
      <button onclick="setLang('fr'); toggleLangDD(false);">🇫🇷 Français</button>
        <button onclick="setLang('it'); toggleLangDD(false);">🇮🇹 Italiano</button>
    </div>
  </div>
  <div style="text-align:center; margin-bottom:24px;">
    <div style="font-size:32px; margin-bottom:8px;">⚜</div>
    <h1 id="h_title" style="font-size:20px; color:#fff; margin:0;"></h1>
  </div>
  <div id="err"></div>
  <label id="l_username"></label>
  <input id="code" style="direction:ltr; text-align:left;">
  <label id="l_password"></label>
  <div style="position:relative;"><input id="password" type="password" style="width:100%; box-sizing:border-box; padding-left:38px;"><span onclick="var i=document.getElementById('password'); i.type = i.type==='password'?'text':'password'; this.textContent = i.type==='password'?'👁️':'🙈';" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:16px;">👁️</span></div>
  <button id="btnLogin" onclick="doLogin()"></button>
  <div style="text-align:center; margin-top:14px;"><a href="#" id="forgotLink" onclick="doForgotPassword(); return false;" style="color:#D4AF37; font-size:13px; font-weight:700;"></a></div>
</div>
<script>
var T = {
  ar:{dir:'rtl',flag:'🇸🇦',label:'العربية',title:'لوحة تحكم السفير',username:'رقم السفير',password:'كلمة المرور',login:'دخول',err:'تعذر الاتصال بالخادم',forgot:'نسيت كلمة المرور؟',forgotPrompt:'أدخل اسم المستخدم أو الكود أو البريد الإلكتروني المسجّل:',forgotSent:'إذا كانت البيانات صحيحة، سيتم إرسال كلمة مرور جديدة إلى بريدك المسجّل.'},
  en:{dir:'ltr',flag:'🇬🇧',label:'English',title:'Ambassador Dashboard',username:'Ambassador Number',password:'Password',login:'Login',err:'Could not connect to the server',forgot:'Forgot password?',forgotPrompt:'Enter your username, code, or registered email:',forgotSent:'If the details are correct, a new password will be sent to your registered email.'},
  de:{dir:'ltr',flag:'🇩🇪',label:'Deutsch',title:'Botschafter-Dashboard',username:'Botschafter-Nummer',password:'Passwort',login:'Anmelden',err:'Verbindung zum Server fehlgeschlagen',forgot:'Passwort vergessen?',forgotPrompt:'Geben Sie Ihren Benutzernamen, Code oder Ihre registrierte E-Mail ein:',forgotSent:'Falls die Angaben korrekt sind, wird ein neues Passwort an Ihre registrierte E-Mail gesendet.'},
  es:{dir:'ltr',flag:'🇪🇸',label:'Español',title:'Panel del Embajador',username:'Número de Embajador',password:'Contraseña',login:'Iniciar sesión',err:'No se pudo conectar al servidor',forgot:'¿Olvidaste tu contraseña?',forgotPrompt:'Ingresa tu usuario, código o correo registrado:',forgotSent:'Si los datos son correctos, se enviará una nueva contraseña a tu correo registrado.'},
  pt:{dir:'ltr',flag:'🇵🇹',label:'Português',title:'Painel do Embaixador',username:'Número do Embaixador',password:'Senha',login:'Entrar',err:'Não foi possível conectar ao servidor',forgot:'Esqueceu a senha?',forgotPrompt:'Digite seu nome de usuário, código ou e-mail registrado:',forgotSent:'Se os dados estiverem corretos, uma nova senha será enviada ao seu e-mail registrado.'},
  tr:{dir:'ltr',flag:'🇹🇷',label:'Türkçe',title:'Elçi Panosu',username:'Elçi Numarası',password:'Şifre',login:'Giriş Yap',err:'Sunucuya bağlanılamadı',forgot:'Şifrenizi mi unuttunuz?',forgotPrompt:'Kullanıcı adınızı, kodunuzu veya kayıtlı e-postanızı girin:',forgotSent:'Bilgiler doğruysa, kayıtlı e-postanıza yeni bir şifre gönderilecektir.'},
  fr:{dir:'ltr',flag:'🇫🇷',label:'Français',title:'Tableau de Bord Ambassadeur',username:'Numéro d\'Ambassadeur',password:'Mot de passe',login:'Connexion',err:'Impossible de se connecter au serveur',forgot:'Mot de passe oublié ?',forgotPrompt:'Entrez votre nom d\'utilisateur, code ou e-mail enregistré :',forgotSent:'Si les informations sont correctes, un nouveau mot de passe sera envoyé à votre e-mail enregistré.'},
  it:{dir:'ltr',flag:'🇮🇹',label:'Italiano',title:'Area Ambasciatore',username:'Numero ambasciatore',password:'Password',login:'Accedi',err:'Impossibile connettersi al server',forgot:'Password dimenticata?',forgotPrompt:'Inserisci il tuo nome utente, codice o e-mail registrata:',forgotSent:'Se i dati sono corretti, una nuova password verrà inviata alla tua e-mail registrata.'}
};
var currentLang = localStorage.getItem('aff_lang') || 'ar';
function setLang(code){
  currentLang = code;
  localStorage.setItem('aff_lang', code);
  var t = T[code];
  document.getElementById('htmlRoot').lang = code;
  document.getElementById('htmlRoot').dir = t.dir;
  document.getElementById('pageTitle').textContent = t.title;
  document.getElementById('h_title').textContent = t.title;
  document.getElementById('l_username').textContent = t.username;
  document.getElementById('l_password').textContent = t.password;
  document.getElementById('btnLogin').textContent = t.login;
  document.getElementById('forgotLink').textContent = t.forgot;
  document.getElementById('langDDFlag').textContent = t.flag;
  document.getElementById('langDDLabel').textContent = t.label;
}
function toggleLangDD(force){
  var menu = document.getElementById('langDDMenu');
  if (typeof force === 'boolean') { menu.classList.toggle('open', force); return; }
  menu.classList.toggle('open');
}
document.addEventListener('click', function(e){
  var wrap = document.getElementById('langDD');
  if (wrap && !wrap.contains(e.target)) toggleLangDD(false);
});
setLang(currentLang);

function doForgotPassword(){
  var t = T[currentLang];
  var identifier = prompt(t.forgotPrompt);
  if (!identifier) return;
  fetch('/api/affiliate-forgot-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ identifier: identifier.trim() }) })
    .then(function(r){ return r.json(); }).then(function(){ alert(t.forgotSent); })
    .catch(function(){ alert(t.forgotSent); });
}

function doLogin(){
  var code = document.getElementById('code').value.trim();
  var password = document.getElementById('password').value;
  var err = document.getElementById('err');
  err.style.display = 'none';
  fetch('/api/affiliate-login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: code, password }) })
    .then(function(r){ return r.json(); }).then(function(res){
      if (res.ok) {
        localStorage.setItem('aff_token', res.token);
        localStorage.setItem('aff_code', res.code);
        location.href = './affiliate-dashboard.html';
      } else {
        err.textContent = res.error || T[currentLang].err;
        err.style.display = 'block';
      }
    }).catch(function(){ err.textContent = T[currentLang].err; err.style.display = 'block'; });
}
</script>
</body>
</html>
